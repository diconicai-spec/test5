<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Model Y Juniper 3D Configurator with HDRI</title>

    <style>
        :root {
            --primary-color: #172033;
            --accent-color: #2563eb;
            --bg-color: #f3f0ea;
            --card-bg: rgba(255, 255, 255, 0.90);
            --card-solid: #ffffff;
            --text-main: #20242c;
            --text-muted: #7c828d;
            --border-color: rgba(32, 36, 44, 0.10);
            --soft-bg: rgba(255,255,255,0.68);
            --shadow-soft: 0 18px 50px rgba(31, 35, 42, 0.10);
            --shadow-card: 0 12px 34px rgba(31, 35, 42, 0.09);
        }

        * { box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 26px;
            background:
                radial-gradient(circle at 38% 12%, rgba(255,255,255,0.96) 0, rgba(255,255,255,0.62) 24%, rgba(243,240,234,0) 50%),
                linear-gradient(180deg, #f7f5f1 0%, #efede8 100%);
        }

        .container {
            max-width: 1540px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 390px;
            gap: 26px;
            align-items: start;
        }

        .left-panel {
            min-width: 0;
            position: relative;
        }

        .header-title {
            min-height: 72px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 16px;
            padding: 0 6px;
        }

        .header-title > div:first-child {
            display: flex;
            align-items: baseline;
            gap: 14px;
            flex-wrap: wrap;
        }

        .header-title h1 {
            margin: 0;
            font-size: clamp(25px, 2vw, 34px);
            line-height: 1;
            font-weight: 800;
            letter-spacing: -0.7px;
        }

        .header-title p {
            margin: 0;
            font-size: 15px;
            color: var(--text-muted);
            font-weight: 650;
        }

        .btn-share {
            border: 1px solid rgba(32,36,44,0.09);
            padding: 10px 17px;
            border-radius: 999px;
            background: rgba(255,255,255,0.82);
            color: var(--text-main);
            font-weight: 750;
            cursor: pointer;
            box-shadow: 0 7px 22px rgba(31,35,42,0.05);
            backdrop-filter: blur(14px);
            transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
        }

        .btn-share:hover {
            transform: translateY(-1px);
            background: #fff;
            box-shadow: 0 10px 28px rgba(31,35,42,0.10);
        }

        /* 상단 차량 설정 바 */
        .options-row {
            display: grid;
            grid-template-columns: 1fr 1.25fr auto auto;
            gap: 12px;
            align-items: end;
            margin-bottom: 14px;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.75);
            border-radius: 20px;
            background: rgba(255,255,255,0.70);
            box-shadow: 0 10px 30px rgba(31,35,42,0.06);
            backdrop-filter: blur(20px);
        }

        .option-group {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .option-group label,
        .deck-label {
            font-size: 11px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: .02em;
            color: #858a93;
        }

        select {
            width: 100%;
            min-width: 120px;
            height: 42px;
            padding: 0 34px 0 13px;
            border: 1px solid rgba(32,36,44,0.10);
            border-radius: 12px;
            outline: none;
            background: rgba(255,255,255,0.90);
            color: var(--text-main);
            font-weight: 700;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.75);
        }

        select:focus {
            border-color: rgba(37,99,235,0.55);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
        }

        .toggle-group {
            display: flex;
            gap: 5px;
            padding: 4px;
            border-radius: 12px;
            background: rgba(31,35,42,0.055);
        }

        .time-btn, .interior-btn, .camera-btn, .film-type-btn {
            min-height: 34px;
            padding: 7px 13px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: #737986;
            font-size: 13px;
            font-weight: 750;
            cursor: pointer;
            transition: all .2s ease;
            white-space: nowrap;
        }

        .time-btn:hover, .interior-btn:hover, .camera-btn:hover, .film-type-btn:hover {
            color: var(--text-main);
            background: rgba(255,255,255,0.72);
        }

        .time-btn.active, .camera-btn.active, .film-type-btn.active {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 6px 16px rgba(23,32,51,0.18);
        }

        .time-btn[data-time="day"].active {
            background: #e3a315;
            color: #fff;
            box-shadow: 0 6px 16px rgba(227,163,21,0.22);
        }

        .interior-btn[data-color="black"].active {
            background: #20242c;
            color: white;
            box-shadow: 0 6px 16px rgba(23,32,51,0.16);
        }

        .interior-btn[data-color="white"].active {
            background: white;
            color: #20242c;
            box-shadow: 0 5px 14px rgba(31,35,42,0.10);
        }

        /* 차량이 메인으로 보이도록 큰 무대 */
        .car-display {
            position: relative;
            width: 100%;
            height: min(67vh, 690px);
            min-height: 560px;
            border-radius: 28px;
            background:
                radial-gradient(ellipse at center, #ffffff 0%, #f1eee7 70%, #e9e6df 100%);
            box-shadow: var(--shadow-soft);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.75);
            transition: background-color 0.5s ease;
        }

        .car-display::after {
            content: "";
            position: absolute;
            inset: auto 7% 5% 7%;
            height: 18%;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(31,35,42,.12), rgba(31,35,42,0) 70%);
            filter: blur(18px);
            pointer-events: none;
            z-index: 0;
        }

        #canvas-container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: block;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        /* 두 번째 참고 이미지 느낌의 하단 컨트롤 데크 */
        .stage-control-deck {
            width: min(880px, calc(100% - 40px));
            margin: -32px auto 0;
            min-height: 82px;
            position: relative;
            z-index: 20;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 18px;
            align-items: center;
            padding: 13px 16px 13px 20px;
            border: 1px solid rgba(255,255,255,0.80);
            border-radius: 24px;
            background: rgba(255,255,255,0.86);
            box-shadow: 0 18px 38px rgba(31,35,42,0.13);
            backdrop-filter: blur(20px);
        }

        .deck-section {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .deck-divider {
            width: 1px;
            height: 42px;
            background: rgba(32,36,44,0.10);
        }

        .color-palette {
            display: flex;
            align-items: center;
            gap: 11px;
            min-width: 0;
            flex-wrap: wrap;
        }

        .color-btn {
            width: 38px;
            height: 38px;
            flex: 0 0 38px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,.95);
            cursor: pointer;
            outline: 1px solid rgba(31,35,42,0.14);
            outline-offset: 2px;
            box-shadow: 0 4px 10px rgba(31,35,42,0.10);
            transition: transform .18s ease, box-shadow .18s ease, outline-color .18s ease;
        }

        .color-btn:hover { transform: translateY(-2px) scale(1.04); }

        .color-btn.active {
            transform: translateY(-2px) scale(1.08);
            outline: 3px solid var(--accent-color);
            outline-offset: 3px;
            box-shadow: 0 7px 17px rgba(31,35,42,0.16);
        }

        /* 오른쪽 틴팅 패널 */
        .right-panel {
            width: 390px;
            position: sticky;
            top: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.82);
            border-radius: 26px;
            padding: 24px;
            box-shadow: var(--shadow-card);
            backdrop-filter: blur(22px);
        }

        .card h2 {
            margin: 0 0 18px;
            font-size: 19px;
            letter-spacing: -0.3px;
        }

        .product-select {
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
            padding: 17px;
            border: 1px solid rgba(37,99,235,0.28);
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(238,245,255,.98), rgba(255,255,255,.96));
            box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
        }

        .product-select::after {
            content: "SELECTED";
            position: absolute;
            right: 14px;
            top: 13px;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: .11em;
            color: var(--accent-color);
            opacity: .75;
        }

        .product-select input[type="checkbox"] {
            width: 20px !important;
            height: 20px !important;
            accent-color: var(--accent-color) !important;
        }

        .film-type-row {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
            margin-bottom: 17px;
            padding-bottom: 17px;
            border-bottom: 1px solid rgba(32,36,44,0.08);
        }

        .film-type-row .toggle-group { width: 100%; }
        .film-type-row .film-type-btn { flex: 1; }

        .tint-row {
            display: grid;
            grid-template-columns: 46px minmax(0,1fr);
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .tint-row:last-child { margin-bottom: 0; }

        .tint-label {
            width: auto;
            font-weight: 800;
            font-size: 13px;
            color: #3f4650;
        }

        .tint-options {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
        }

        .tint-btn {
            aspect-ratio: 1 / 1;
            width: 100%;
            min-width: 0;
            max-width: 42px;
            justify-self: center;
            border-radius: 50%;
            border: 1px solid transparent;
            background: #f0f1f3;
            color: #858b96;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: transform .18s ease, background .18s ease, color .18s ease, box-shadow .18s ease;
        }

        .tint-btn:hover {
            transform: translateY(-1px);
            background: #e5e7eb;
            color: #535964;
        }

        .tint-btn.active {
            transform: translateY(-1px);
            background: var(--accent-color);
            color: white;
            box-shadow: 0 7px 15px rgba(37,99,235,.22);
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1rem;
            font-weight: 800;
            color: var(--primary-color);
            padding: 10px 15px;
            border-radius: 999px;
            background: rgba(255,255,255,.84);
            box-shadow: 0 8px 22px rgba(31,35,42,.08);
            backdrop-filter: blur(12px);
            pointer-events: none;
            z-index: 30;
        }

        @media (max-width: 1180px) {
            body { padding: 18px; }
            .container {
                grid-template-columns: 1fr;
                max-width: 1050px;
            }
            .right-panel {
                width: 100%;
                position: static;
            }
            .card { padding: 22px; }
            .car-display { height: 620px; }
            .tint-options { grid-template-columns: repeat(6, minmax(38px, 44px)); justify-content: start; }
        }

        @media (max-width: 760px) {
            body {
                padding: 12px;
            }

            .container {
                display: block;
                max-width: none;
            }

            .left-panel {
                display: block;
                min-width: 0;
            }

            .header-title {
                min-height: auto;
                margin: 0 0 10px;
                padding: 8px 3px 2px;
            }

            .header-title h1 { font-size: 22px; }
            .header-title p { width: 100%; font-size: 13px; }
            .btn-share { padding: 9px 13px; }

            .options-row {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                margin-bottom: 14px;
                padding: 11px;
            }

            /*
             * 모바일 기본 상태:
             * 차량 화면은 브랜드/모델/실내/시점 아래에 표시됩니다.
             * 스크롤해서 차량 화면이 상단에 닿는 순간 JS가 .mobile-car-fixed를 붙여
             * 이후 페이지 끝까지 화면 상단에 고정합니다.
             */
            .car-display {
                width: 100%;
                height: 58vh;
                min-height: 430px;
                max-height: 780px;
                margin: 0;
                border-radius: 20px;
                box-shadow: 0 14px 36px rgba(31,35,42,0.16);
            }

            .car-display.mobile-car-fixed {
                position: fixed !important;
                top: 0 !important;
                left: 12px !important;
                right: 12px !important;
                width: auto !important;
                z-index: 5000 !important;
                margin: 0 !important;
                border-radius: 0 0 20px 20px;
                box-shadow: 0 16px 38px rgba(31,35,42,0.22);
            }

            /* 고정되는 순간 원래 차량 자리 높이를 보존해 화면 점프 방지 */
            .mobile-car-placeholder {
                display: none;
                width: 100%;
            }

            .mobile-car-placeholder.active {
                display: block;
            }

            .stage-control-deck {
                width: 100%;
                margin: 12px 0 14px;
                grid-template-columns: 1fr;
                gap: 12px;
                border-radius: 20px;
                padding: 14px;
            }

            .deck-divider { display: none; }

            .stage-control-deck .toggle-group {
                justify-self: stretch;
                width: 100%;
            }

            .stage-control-deck .time-btn {
                flex: 1;
            }

            .color-palette {
                gap: 10px;
                justify-content: space-between;
                flex-wrap: nowrap;
            }

            .color-btn {
                width: 34px;
                height: 34px;
                flex-basis: 34px;
            }

            .right-panel {
                width: 100%;
                margin-top: 0;
                position: static;
            }

            .card {
                border-radius: 22px;
                padding: 18px 14px 28px;
            }

            .film-type-row .toggle-group {
                width: 100%;
            }

            .tint-row {
                grid-template-columns: 42px minmax(0,1fr);
                gap: 6px;
            }

            .tint-options {
                gap: 4px;
                grid-template-columns: repeat(6, 1fr);
            }

            .tint-btn {
                max-width: 40px;
                font-size: 10px;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    <!-- GLB 모델을 로드하기 위한 GLTFLoader 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <style>
        /* 실내색상 / 시점 버튼: 블랙 & 화이트 심플 스타일 */
        .option-group .toggle-group:has(.interior-btn),
        .option-group .toggle-group:has(.camera-btn) {
            background: #ffffff !important;
            border: 1px solid #e5e5e5 !important;
            padding: 4px !important;
        }

        .interior-btn,
        .camera-btn {
            background: #ffffff !important;
            color: #111111 !important;
            border: 0 !important;
            box-shadow: none !important;
        }

        .interior-btn.active,
        .camera-btn.active,
        .interior-btn[data-color="black"].active,
        .interior-btn[data-color="white"].active {
            background: #111111 !important;
            color: #ffffff !important;
            border: 0 !important;
            box-shadow: none !important;
        }

        .interior-btn:hover,
        .camera-btn:hover {
            background: #f7f7f7 !important;
            color: #111111 !important;
        }

        .interior-btn.active:hover,
        .camera-btn.active:hover {
            background: #111111 !important;
            color: #ffffff !important;
        }
    </style>


    <style>
        /* =========================
           추가 블랙/화이트 통일 스타일
           - 배경(낮/밤)
           - 틴팅 농도 버튼
           - 제품 선택 박스
           ========================= */

        /* 배경(낮/밤) */
        .stage-control-deck .toggle-group {
            background: #ffffff !important;
            border: 1px solid #e5e5e5 !important;
            padding: 4px !important;
        }

        .time-btn {
            background: #ffffff !important;
            color: #111111 !important;
            border: 0 !important;
            box-shadow: none !important;
        }

        .time-btn.active,
        .time-btn[data-time="day"].active,
        .time-btn[data-time="night"].active {
            background: #111111 !important;
            color: #ffffff !important;
            border: 0 !important;
            box-shadow: none !important;
        }

        .time-btn:hover {
            background: #f7f7f7 !important;
            color: #111111 !important;
        }

        .time-btn.active:hover {
            background: #111111 !important;
            color: #ffffff !important;
        }

        /* 틴팅 농도 버튼 */
        .tint-btn {
            background: #f3f3f3 !important;
            color: #666666 !important;
            border: 1px solid #ececec !important;
            box-shadow: none !important;
        }

        .tint-btn:hover {
            background: #ebebeb !important;
            color: #222222 !important;
            box-shadow: none !important;
        }

        .tint-btn.active {
            background: #111111 !important;
            color: #ffffff !important;
            border: 1px solid #111111 !important;
            box-shadow: none !important;
        }

        /* 제품 선택 박스 */
        .product-select {
            background: #ffffff !important;
            border: 1px solid #dddddd !important;
            box-shadow: none !important;
        }

        .product-select::after {
            color: #666666 !important;
        }

        .product-select input[type="checkbox"] {
            accent-color: #111111 !important;
        }

        /* 필름 타입도 함께 통일 */
        .film-type-row .toggle-group {
            background: #ffffff !important;
            border: 1px solid #e5e5e5 !important;
            padding: 4px !important;
        }

        .film-type-btn {
            background: #ffffff !important;
            color: #111111 !important;
            border: 0 !important;
            box-shadow: none !important;
        }

        .film-type-btn.active {
            background: #111111 !important;
            color: #ffffff !important;
            border: 0 !important;
            box-shadow: none !important;
        }

        .film-type-btn:hover {
            background: #f7f7f7 !important;
            color: #111111 !important;
        }

        .film-type-btn.active:hover {
            background: #111111 !important;
            color: #ffffff !important;
        }
    </style>


    <style>
        /* 브랜드 / 모델 / 실내색상 / 시점 = 차량 화면 바로 아래 */
        .left-panel > .car-display + .options-row {
            margin-top: 14px !important;
            margin-bottom: 14px !important;
        }

        @media (max-width: 760px) {
            .left-panel > .car-display + .options-row,
            .left-panel > .mobile-car-placeholder + .options-row {
                margin-top: 12px !important;
                margin-bottom: 14px !important;
            }
        }
    </style>


    <style>
        /* PC에서 차량 색상/배경 패널이 브랜드·모델 옵션과 겹치지 않도록 조정 */
        @media (min-width: 761px) {
            .left-panel > .options-row + .stage-control-deck {
                margin-top: 12px !important;
                margin-bottom: 0 !important;
                position: relative;
                z-index: 10;
            }
        }

        /* 모바일은 기존 간격 유지 */
        @media (max-width: 760px) {
            .left-panel > .options-row + .stage-control-deck {
                margin-top: 12px !important;
            }
        }
    </style>

</head>
<body>


<div class="container">
    <div class="left-panel">
        <div class="header-title">
            <div>
                <h1>Tesla Model Y Juniper</h1>
                <p id="selected-color-name">스텔스 그레이</p>
            </div>
            <button class="btn-share">공유하기</button>
        </div>

        <div class="car-display" id="car-display">
            <div id="loading">Loading Model & Environment...</div>
            <div id="canvas-container"></div>
        </div>

        <div class="options-row">
            <div class="option-group">
                <label>브랜드</label>
                <select>
                    <option>테슬라</option>
                </select>
            </div>

            <div class="option-group">
                <label>모델</label>
                <select>
                    <option>모델 Y 주니퍼</option>
                    <option>모델 YL</option>
                    <option>모델 3</option>
                </select>
            </div>

            <div class="option-group">
                <label>실내색상</label>
                <div class="toggle-group">
                    <button class="interior-btn active" data-color="black">블랙</button>

<script>
    window.addEventListener('error', function(e) {
        const el = document.getElementById('loading');
        if (el) {
            el.style.display = 'block';
            el.innerText = '스크립트 오류: ' + (e.message || '알 수 없는 오류');
        }
        console.error(e.error || e.message);
    });
    window.addEventListener('unhandledrejection', function(e) {
        const el = document.getElementById('loading');
        if (el) {
            el.style.display = 'block';
            el.innerText = '로드 오류: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
        }
        console.error(e.reason);
    });

    // --- Three.js Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(4, 2, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight, false);
    const isMobileDevice = window.matchMedia('(max-width: 760px)').matches;
    // 모바일 고해상도 디스플레이에서 GPU 부하가 급증하지 않도록 렌더링 해상도 제한
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobileDevice ? 1.35 : 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0; 
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 2;
    controls.maxDistance = 10;

    controls.target.set(0, 0.6, 0);                       
    controls.maxPolarAngle = Math.PI / 2 - 0.03;           

    let dayExrTexture = null;
    let hdriBackgroundSphere = null;

    // HDRI 배경 회전값: 숫자를 바꾸면 배경 방향이 돌아갑니다.
    // 예) Math.PI * 0.25 = 약 90도, Math.PI * 0.5 = 약 180도
    const HDRI_ROTATION_Y = Math.PI * 0.25;

    function createOrUpdateHdriBackground(texture) {
        if (!texture) return;

        if (hdriBackgroundSphere) {
            scene.remove(hdriBackgroundSphere);
            if (hdriBackgroundSphere.geometry) hdriBackgroundSphere.geometry.dispose();
            if (hdriBackgroundSphere.material) {
                if (hdriBackgroundSphere.material.map) hdriBackgroundSphere.material.map.dispose();
                hdriBackgroundSphere.material.dispose();
            }
            hdriBackgroundSphere = null;
        }

        const bgTexture = texture.clone();
        bgTexture.mapping = THREE.UVMapping;
        bgTexture.needsUpdate = true;

        const bgGeometry = new THREE.SphereGeometry(50, 64, 32);
        const bgMaterial = new THREE.MeshBasicMaterial({
            map: bgTexture,
            side: THREE.BackSide
        });

        hdriBackgroundSphere = new THREE.Mesh(bgGeometry, bgMaterial);
        hdriBackgroundSphere.rotation.y = HDRI_ROTATION_Y;
        hdriBackgroundSphere.frustumCulled = false;
        hdriBackgroundSphere.renderOrder = -1000;
        scene.add(hdriBackgroundSphere);

        // 배경은 scene.background 직접 적용 대신, 회전 가능한 구체 배경을 사용합니다.
        scene.background = null;
    }

    // 조명 세팅
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.1); 
    scene.add(ambientLight);
    
    const dirLight = new THREE.DirectionalLight(0xfffaeb, 1.0);
    dirLight.position.set(8, 6, 5); 
    scene.add(dirLight);

    const topLight = new THREE.DirectionalLight(0xffffff, 0.5);
    topLight.position.set(0, 10, 0);
    scene.add(topLight);

    const interiorLight = new THREE.PointLight(0xffecc4, 0, 3);
    interiorLight.position.set(0, 1.0, 0);
    scene.add(interiorLight);

    // 글로벌 매테리얼 변수 (차량 바디 배열로 변경)
    let carBodyMaterials = []; 
    let interiorMaterial = null; 
    let interiorMaterials = []; // 전체 실내 재질 무광 처리용 배열
    let seatMaterials = []; // 실내색상 버튼으로 색상 변경할 시트 재질만 저장
    let interiorTrimMaterials = []; // 도어/대시보드/필러 등 내장재는 항상 다크 무광 유지
    let glassMaterials = {
        front: [],
        row1: [],
        row2: [],
        rear: [],
        sunroof: []
    };

    // 내부 시점에서 유리창을 확실히 밝게 보이게 하기 위해 유리 메쉬 자체를 저장
    let glassMeshes = [];

    // glass_border는 썬팅/반사 대상에서 제외하고, 실제 깊이값을 따르는 검정 내부 테두리로 처리
    let glassBorderMeshes = [];

    // glass_front_film / glass_quarter_film / glass_rear_film을 추가했기 때문에
    // 기존 바깥 유리는 약한 투명 유리로만 처리하고, 실제 반사/틴팅은 film 오브젝트에 적용합니다.
    let outerGlassMeshes = [];

    let glassTintValues = {
        front: 22,
        row1: 15,
        row2: 15,
        rear: 15,
        sunroof: 5
    };

    let currentFilmType = 'reflective';
    let currentViewMode = 'exterior';
    let neonGroup;

    // 환경 맵 (HDRI) 로더
    // EXRLoader가 로드되지 않아도 모델 로딩이 멈추지 않도록 안전 처리
    const DEFAULT_HDRI_URL = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/4k/quattro_canti_4k.exr';
    if (THREE.EXRLoader) {
        const exrLoader = new THREE.EXRLoader();
        exrLoader.load(DEFAULT_HDRI_URL, function (texture) {
            texture.mapping = THREE.EquirectangularReflectionMapping;
            dayExrTexture = texture;
            
            scene.environment = dayExrTexture;
            createOrUpdateHdriBackground(dayExrTexture);
            
            updateAllGlassMaterials();
            if (carBodyMaterials.length > 0) {
                carBodyMaterials.forEach(mat => mat.needsUpdate = true);
            }
        }, undefined, function(error) {
            console.warn('HDRI 로드 실패. 기본 배경으로 진행합니다.', error);
            scene.background = new THREE.Color(0xffffff);
        });
    } else {
        console.warn('EXRLoader가 없어 기본 배경으로 진행합니다.');
        scene.background = new THREE.Color(0xffffff);
    }

    // 야간 모드 조명 세팅
    // 기존 9개의 PointLight 대신 3개만 사용해 모바일 GPU 부하를 크게 줄입니다.
    // 따뜻한 가로등/상점 조명 느낌을 주도록 색온도를 나눠 배치합니다.
    function setupNeonLights() {
        neonGroup = new THREE.Group();

        // 왼쪽 상단에서 비추는 따뜻한 가로등 느낌
        const streetLampMain = new THREE.PointLight(0xffcc7a, 1.25, 7.5, 2);
        streetLampMain.position.set(-3.6, 3.8, 2.0);
        neonGroup.add(streetLampMain);

        // 오른쪽 뒤편 상점/간접 조명 느낌
        const streetLampSide = new THREE.PointLight(0xffdfaa, 0.72, 5.5, 2);
        streetLampSide.position.set(3.0, 2.8, -2.6);
        neonGroup.add(streetLampSide);

        // 밤에 완전히 먹먹하지 않도록 아주 약한 하늘/지면 채움광
        const nightFill = new THREE.HemisphereLight(0x6a7fa5, 0x24180f, 0.18);
        neonGroup.add(nightFill);

        scene.add(neonGroup);
        neonGroup.visible = false;
    }
    setupNeonLights();

    // HDRI 배경 위에 먼 거리의 가로등/상점 불빛처럼 보이는 글로우를 얹습니다.
    // 실제 조명을 많이 추가하지 않고도 '불이 켜진 밤거리' 느낌을 내기 위한 저비용 효과입니다.
    let nightGlowGroup = null;

    function makeGlowSprite(color, opacity, scaleX, scaleY) {
        const size = 128;
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        const ctx = canvas.getContext('2d');
        const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
        g.addColorStop(0, `rgba(${(color>>16)&255}, ${(color>>8)&255}, ${color&255}, ${opacity})`);
        g.addColorStop(0.25, `rgba(${(color>>16)&255}, ${(color>>8)&255}, ${color&255}, ${opacity * 0.55})`);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, size, size);

        const tex = new THREE.CanvasTexture(canvas);
        tex.encoding = THREE.sRGBEncoding;
        const mat = new THREE.SpriteMaterial({
            map: tex,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });
        const sprite = new THREE.Sprite(mat);
        sprite.scale.set(scaleX, scaleY, 1);
        return sprite;
    }

    function setupNightBackgroundGlows() {
        nightGlowGroup = new THREE.Group();

        // 카메라 정면 기준으로 멀리 배치되는 따뜻한 도시 불빛
        // 멀리서 보이는 따뜻한 가로등 / 상점 불빛
        const glow1 = makeGlowSprite(0xffc46d, 1.00, 1.7, 1.7);
        glow1.position.set(-6.8, 4.5, -10.5);
        nightGlowGroup.add(glow1);

        const glow2 = makeGlowSprite(0xffdc96, 0.88, 1.45, 1.45);
        glow2.position.set(5.6, 3.9, -11.2);
        nightGlowGroup.add(glow2);

        const glow3 = makeGlowSprite(0xffb660, 0.62, 1.0, 1.0);
        glow3.position.set(1.7, 2.9, -12.0);
        nightGlowGroup.add(glow3);

        scene.add(nightGlowGroup);
        nightGlowGroup.visible = false;
    }

    setupNightBackgroundGlows();


    // 실내 재질 기본 색상
    const INTERIOR_TRIM_COLOR = 0x111111; // 도어/대시보드/필러/블랙시트 공통 색상
    const WHITE_SEAT_COLOR = 0xdddddd;    // 화이트 시트 색상

    // 실내 재질 무광 처리 함수
    function applyInteriorMatte(mat) {
        if (!mat) return;

        // 실내 플라스틱/가죽 느낌: 반사 줄이고 무광에 가깝게
        mat.metalness = 0.0;
        mat.roughness = 0.94;
        mat.envMapIntensity = 0.01;

        if ('clearcoat' in mat) mat.clearcoat = 0.0;
        if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 1.0;

        mat.needsUpdate = true;
    }

    // 전면 유리 테두리 전용: 유리 안쪽 검정 세라믹 라인처럼 보이게 처리
    // 중요: depthTest를 끄거나 renderOrder를 과하게 올리면 차체를 뚫고 보입니다.
    function applyGlassBorderMaterial(mat) {
        if (!mat) return;

        mat.color.setHex(0x050505);

        // 유리 안쪽의 검정 테두리처럼 자연스럽게 보이도록 일반 불투명 재질로 처리
        mat.transparent = false;
        mat.opacity = 1.0;

        // 차체에 가려질 부분은 정상적으로 가려지게 함
        mat.depthTest = true;
        mat.depthWrite = true;

        mat.side = THREE.DoubleSide;
        mat.blending = THREE.NormalBlending;
        mat.premultipliedAlpha = false;

        // 반사/틴팅 효과 제거
        mat.metalness = 0.0;
        mat.roughness = 0.95;
        mat.envMapIntensity = 0.0;
        mat.reflectivity = 0.0;

        if ('clearcoat' in mat) mat.clearcoat = 0.0;
        if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 1.0;
        if ('transmission' in mat) mat.transmission = 0.0;
        if ('ior' in mat) mat.ior = 1.0;
        if ('thickness' in mat) mat.thickness = 0.0;

        // 강제로 앞으로 빼지 않음. 모델의 실제 위치/깊이값을 그대로 사용합니다.
        mat.polygonOffset = false;

        mat.needsUpdate = true;
    }

    // 바깥 유리 전용: 실제 유리 형태만 살리고, 썬팅/반사 필름 효과는 주지 않습니다.
    // 이렇게 해야 glass_border가 유리 안쪽에 자연스럽게 보이고, film 오브젝트만 농도/반사를 담당합니다.
    function applyOuterGlassMaterial(mat) {
        if (!mat) return;

        mat.color.setHex(0x7f9a92);
        mat.transparent = true;
        mat.opacity = 0.18;

        // 바깥 유리는 약한 기본 광택만 유지
        mat.metalness = 0.0;
        mat.roughness = 0.18;
        mat.envMapIntensity = 0.16;

        if ('clearcoat' in mat) mat.clearcoat = 0.16;
        if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 0.18;
        if ('transmission' in mat) mat.transmission = 0.0;
        if ('ior' in mat) mat.ior = 1.45;
        if ('thickness' in mat) mat.thickness = 0.005;

        mat.depthTest = true;
        mat.depthWrite = false;
        mat.side = THREE.DoubleSide;
        mat.blending = THREE.NormalBlending;
        mat.premultipliedAlpha = false;
        mat.polygonOffset = false;
        mat.needsUpdate = true;
    }

    // 도어/대시보드/필러 등 내장재는 항상 첫 번째 사진처럼 다크 무광으로 고정
    function setInteriorTrimBase() {
        interiorTrimMaterials.forEach(mat => {
            mat.color.setHex(INTERIOR_TRIM_COLOR);
            applyInteriorMatte(mat);
        });
    }

    // 실내색상 버튼은 내장재 전체가 아니라 시트만 변경
    // 화이트 버튼: 시트만 화이트, 내장재는 다크 유지
    // 블랙 버튼: 시트를 내장재와 같은 다크 색상으로 변경
    function updateSeatColor(colorHex) {
        setInteriorTrimBase();

        if (seatMaterials.length > 0) {
            seatMaterials.forEach(mat => {
                mat.color.setHex(colorHex);
                applyInteriorMatte(mat);
            });
        } else if (interiorMaterial) {
            interiorMaterial.color.setHex(colorHex);
            applyInteriorMatte(interiorMaterial);
        }
    }

    // 썬팅 옵션 함수
    function applyGlassProperties(mat, partName, tintValue, filmType) {
        if (!mat) return;

        mat.transparent = true;
        mat.depthWrite = false;
        mat.side = THREE.FrontSide;
        mat.blending = THREE.NormalBlending;
        mat.premultipliedAlpha = false;

        if ('transmission' in mat) mat.transmission = 0; 
        if ('ior' in mat) mat.ior = 1.45;
        if ('thickness' in mat) mat.thickness = 0.01;

        let opacityValue;
        let colorValue;

        // 일반 유리 농도값
        // 숫자가 높을수록 더 불투명하게 보여서 어두워집니다.
        if (tintValue >= 70) {
            opacityValue = 0.45;
            colorValue = 0x000000;
        } else if (tintValue >= 50) {
            opacityValue = 0.60;
            colorValue = 0x000000;
        } else if (tintValue >= 30) {
            opacityValue = 0.79;
            colorValue = 0x000000;
        } else if (tintValue >= 22) {
            opacityValue = 0.83;
            colorValue = 0x000000;
        } else if (tintValue >= 15) {
            opacityValue = 0.85;
            colorValue = 0x000000;
        } else {
            // 5% 농도: 거의 검정
            opacityValue = 0.90;
            colorValue = 0x000000;
        }

        // 썬루프 전용 농도값
        // 썬루프는 기본 유리 자체가 이미 5%급으로 어두운 상태라고 보고,
        // 버튼 농도는 그 위에 추가 필름을 붙이는 개념으로 조금씩 더 어둡게 적용합니다.
        if (partName === 'sunroof') {
            if (tintValue >= 70) {
                opacityValue = 0.98;   // 기본 썬루프보다 살짝 어두움
            } else if (tintValue >= 50) {
                opacityValue = 0.982;
            } else if (tintValue >= 30) {
                opacityValue = 0.984;
            } else if (tintValue >= 22) {
                opacityValue = 0.986;
            } else if (tintValue >= 15) {
                opacityValue = 0.988;
            } else {
                // 5% 필름 추가: 가장 어두움
                opacityValue = 0.99;
            }

            colorValue = 0x000000;
        }

        if (filmType === 'reflective') {
            // 반사 필름: 표면 반사 + 안쪽에 필름이 붙은 듯한 그린/브론즈 색감
            mat.color.setHex(0x182820);

            // 기존 농도보다 살짝 더 어둡게 해서 내부에 필름층이 있는 느낌
            mat.opacity = Math.min(opacityValue + 0.08, 0.96);

            // 반사는 유지하되 너무 거울처럼만 보이지 않게 조정
            mat.metalness = 0.32;
            mat.roughness = 0.09;
            mat.envMapIntensity = 0.55;
            mat.clearcoat = 0.55;
            mat.clearcoatRoughness = 0.05;

        } else {
            // 비반사 필름: 완전 무광 말고 약한 반사감
            mat.color.setHex(0x000000);
            mat.opacity = Math.min(opacityValue, 0.99);

            mat.metalness = 0.05;
            mat.roughness = 0.1;
            mat.envMapIntensity = 0.30;
            mat.clearcoat = 0.30;
            mat.clearcoatRoughness = 0.20;
        }

        // 내부 시점에서는 밖을 밝게 보이게 하되, 농도 버튼 변화는 유지합니다.
        // 외부 시점보다 연하게 보이도록 내부 전용 농도값을 따로 적용합니다.
        if (currentViewMode === 'interior') {
            mat.color.setHex(0x000000);

            if (partName === 'sunroof') {
                // 내부에서 보는 썬루프도 기본부터 어둡고,
                // 버튼 농도가 낮아질수록 조금씩 더 어둡게 보이게 합니다.
                if (tintValue >= 70) {
                    mat.opacity = 0.58;
                } else if (tintValue >= 50) {
                    mat.opacity = 0.60;
                } else if (tintValue >= 30) {
                    mat.opacity = 0.62;
                } else if (tintValue >= 22) {
                    mat.opacity = 0.65;
                } else if (tintValue >= 15) {
                    mat.opacity = 0.67;
                } else {
                    // 5%
                    mat.opacity = 0.69;
                }
            } else {
                // 일반 유리 내부 시점 농도
                if (tintValue >= 70) {
                    mat.opacity = 0.05;
                } else if (tintValue >= 50) {
                    mat.opacity = 0.09;
                } else if (tintValue >= 30) {
                    mat.opacity = 0.16;
                } else if (tintValue >= 22) {
                    mat.opacity = 0.20;
                } else if (tintValue >= 15) {
                    mat.opacity = 0.25;
                } else {
                    // 5%
                    mat.opacity = 0.34;
                }
            }

            // 내부에서 밖을 볼 때 반사 필름은 살짝 반사가 보이게 적용합니다.
            // 비반사 필름은 기존처럼 반사를 거의 줄입니다.
            if (filmType === 'reflective') {
                mat.metalness = 0.12;
                mat.roughness = 0.18;
                mat.envMapIntensity = 0.18;
                mat.clearcoat = 0.18;
                mat.clearcoatRoughness = 0.12;
            } else {
                mat.metalness = 0.0;
                mat.roughness = 0.35;
                mat.envMapIntensity = 0.02;
                mat.clearcoat = 0.02;
                mat.clearcoatRoughness = 0.4;
            }

            mat.side = THREE.DoubleSide;
        }

        mat.needsUpdate = true;
    }

    function updateAllGlassMaterials() {
        Object.keys(glassMaterials).forEach(part => {
            const tintVal = glassTintValues[part];
            glassMaterials[part].forEach(mat => {
                applyGlassProperties(mat, part, tintVal, currentFilmType);
            });
        });

        // glass_border는 어떤 버튼을 눌러도 반사/틴팅에서 제외
        // 단, 차체를 뚫고 보이지 않도록 depthTest/depthWrite는 유지합니다.
        glassBorderMeshes.forEach(mesh => {
            if (mesh && mesh.material) {
                applyGlassBorderMaterial(mesh.material);
                mesh.visible = true;
                mesh.renderOrder = 3;
            }
        });

        // 기존 바깥 유리는 약한 투명 유리로만 유지하고, 농도/반사는 film 오브젝트가 담당합니다.
        outerGlassMeshes.forEach(mesh => {
            if (mesh && mesh.material) {
                applyOuterGlassMaterial(mesh.material);
                mesh.visible = true;
                mesh.renderOrder = 1;
            }
        });
    }

    // 내부 시점 전용: 유리창을 숨기지 않고, 농도별로 밝게 다시 적용
    function setInteriorGlassView() {
        glassMeshes.forEach(mesh => {
            mesh.visible = true;
        });
        updateAllGlassMaterials();
    }

    // 외부 시점 전용: 유리창을 다시 켜고 원래 썬팅 농도/반사 설정 복구
    function restoreExteriorGlassView() {
        glassMeshes.forEach(mesh => {
            mesh.visible = true;
        });
        updateAllGlassMaterials();
    }

    // ==========================================
    // 수정된 GLB 로딩 스크립트: 오리진 유지 및 유리 개별 매핑 (배열 기반)
    // ==========================================
    const loadingEl = document.getElementById('loading');

    function showLoadingMessage(message) {
        if (loadingEl) {
            loadingEl.style.display = 'block';
            loadingEl.innerText = message;
        }
    }

    function handleModelLoaded(gltf) {
        try {
        const model = gltf.scene;

        model.traverse((child) => {
            if (child.isMesh && child.material) {
                // 머테리얼 및 메쉬 이름을 소문자로 가져옵니다.
                const matName = child.material.name.toLowerCase();
                const meshName = child.name.toLowerCase();
                
                // 1. 차량 도장면 (머테리얼 이름: body)
                if (matName.includes('body')) {
                    // 번호판(plate, license) 메쉬가 바디와 재질을 공유할 경우 예외 처리
                    if (!meshName.includes('plate') && !meshName.includes('license')) {
                        const bodyMat = child.material.clone();
                        bodyMat.metalness = 0.25;
                        bodyMat.roughness = 0.45;
                        bodyMat.clearcoat = 0.35;
                        bodyMat.clearcoatRoughness = 0.25;
                        
                        child.material = bodyMat;
                        carBodyMaterials.push(bodyMat); // 색상 제어를 위해 배열에 저장
                    }
                }
                
                // 2. 실내 시트 / 도어 안쪽 / 대시보드 / 실내 트림 무광 처리
                const interiorKey = matName + ' ' + meshName;

                // 시트만 색상 변경 대상입니다.
                const isSeatPart = interiorKey.includes('seat');

                // 내장재는 항상 다크 무광으로 고정합니다.
                const isInteriorTrimPart =
                    interiorKey.includes('interior') ||
                    interiorKey.includes('cabin') ||
                    interiorKey.includes('door') ||
                    interiorKey.includes('dashboard') ||
                    interiorKey.includes('dash') ||
                    interiorKey.includes('panel') ||
                    interiorKey.includes('trim') ||
                    interiorKey.includes('leather') ||
                    interiorKey.includes('black');

                const isExcludedInteriorPart =
                    interiorKey.includes('glass') ||
                    interiorKey.includes('window') ||
                    interiorKey.includes('windshield') ||
                    interiorKey.includes('body') ||
                    interiorKey.includes('paint') ||
                    interiorKey.includes('wheel') ||
                    interiorKey.includes('tire') ||
                    interiorKey.includes('rim') ||
                    interiorKey.includes('chrome') ||
                    interiorKey.includes('metal');

                if ((isSeatPart || isInteriorTrimPart) && !isExcludedInteriorPart) {
                    const interiorMat = child.material.clone();

                    if (isSeatPart) {
                        // 기본 블랙 버튼 상태: 시트도 내장재와 같은 색상
                        interiorMat.color.setHex(INTERIOR_TRIM_COLOR);
                        seatMaterials.push(interiorMat);
                        interiorMaterial = interiorMat; // 기존 버튼 호환용
                    } else {
                        // 도어/대시보드/필러 등은 화이트 버튼을 눌러도 변하지 않음
                        interiorMat.color.setHex(INTERIOR_TRIM_COLOR);
                        interiorTrimMaterials.push(interiorMat);
                    }

                    // 실내 광택 제거
                    applyInteriorMatte(interiorMat);

                    child.material = interiorMat;
                    interiorMaterials.push(interiorMat);
                }
                
                // 3. 유리 필름 / 유리 테두리 / 바깥 유리 역할 분리
                const glassKey = matName + ' ' + meshName;

                // 새로 추가한 실제 썬팅 필름 오브젝트
                // 이 3개에만 전면/쿼터/후면 반사 필름 효과를 적용합니다.
                const isGlassFilm =
                    glassKey.includes('glass_front_film') ||
                    glassKey.includes('glass_quarter_film') ||
                    glassKey.includes('glass_rear_film');

                if (isGlassFilm) {
                    const filmMat = child.material.clone();

                    filmMat.transparent = true;
                    filmMat.depthWrite = false;
                    filmMat.depthTest = true;
                    filmMat.side = THREE.DoubleSide;
                    filmMat.blending = THREE.NormalBlending;
                    filmMat.premultipliedAlpha = false;
                    filmMat.polygonOffset = true;
                    filmMat.polygonOffsetFactor = -1;
                    filmMat.polygonOffsetUnits = -1;
                    filmMat.needsUpdate = true;

                    child.material = filmMat;
                    child.renderOrder = 4;
                    glassMeshes.push(child);

                    if (glassKey.includes('glass_front_film')) {
                        glassMaterials.front.push(filmMat);
                    } else if (glassKey.includes('glass_quarter_film')) {
                        // 3열 쿼터 유리는 별도 버튼이 없으므로 2열 농도 버튼에 연결합니다.
                        glassMaterials.row2.push(filmMat);
                    } else if (glassKey.includes('glass_rear_film')) {
                        glassMaterials.rear.push(filmMat);
                    }

                    return;
                }

                // glass_border는 전면/쿼터/후면 검정 테두리 전체입니다.
                // 썬팅/반사 효과를 적용하지 않고 검정 내부 세라믹 라인처럼 고정합니다.
                const isGlassBorder =
                    glassKey.includes('glass_border') ||
                    glassKey.includes('glass_front_border') ||
                    glassKey.includes('glass_quarter_border') ||
                    glassKey.includes('glass_rear_border') ||
                    glassKey.includes('windshield_border') ||
                    glassKey.includes('front_border') ||
                    glassKey.includes('quarter_border') ||
                    glassKey.includes('rear_border') ||
                    glassKey.includes('frit') ||
                    glassKey.includes('ceramic');

                if (isGlassBorder) {
                    const borderMat = child.material.clone();
                    applyGlassBorderMaterial(borderMat);
                    child.material = borderMat;

                    child.renderOrder = 3;
                    child.frustumCulled = false;
                    glassBorderMeshes.push(child);

                    return;
                }

                // 4. 기존 바깥 유리와 일반 유리 처리
                if (matName.includes('glass') || meshName.includes('glass') || meshName.includes('window') || meshName.includes('windshield')) {
                    const glassMat = child.material.clone();
                    child.material = glassMat;
                    glassMeshes.push(child);

                    // 새 film 오브젝트가 생긴 전면/쿼터/후면의 기존 바깥 유리는
                    // 진한 반사/틴팅을 빼고 약한 투명 유리로만 남깁니다.
                    const isSeparatedOuterGlass =
                        (glassKey.includes('glass_front') && !glassKey.includes('film')) ||
                        (glassKey.includes('glass_rear') && !glassKey.includes('film')) ||
                        (glassKey.includes('object_4.005')) ||
                        (glassKey.includes('object_4.004')) ||
                        (glassKey.includes('object_4.007'));

                    if (isSeparatedOuterGlass) {
                        applyOuterGlassMaterial(glassMat);
                        child.renderOrder = 1;
                        outerGlassMeshes.push(child);
                        return;
                    }

                    glassMat.transparent = true;
                    glassMat.depthWrite = false;
                    glassMat.depthTest = true;
                    glassMat.side = THREE.FrontSide;
                    glassMat.blending = THREE.NormalBlending;
                    glassMat.premultipliedAlpha = false;
                    // 로딩 직후 기본 유리도 더 어둡게 시작
                    glassMat.opacity = 0.84;
                    glassMat.color.setHex(0x000000);
                    glassMat.metalness = 0.04;
                    glassMat.roughness = 0.55;
                    glassMat.envMapIntensity = 0.08;
                    glassMat.needsUpdate = true;

                    child.renderOrder = 2;

                    // 이름에 포함된 키워드에 따라 썬팅 배열에 각각 할당합니다.
                    // 머테리얼 이름 또는 메쉬 이름 어디에 들어있어도 잡히도록 같이 검사합니다.
                    if (glassKey.includes('glass_1')) {
                        glassMaterials.row1.push(glassMat);
                    }
                    else if (glassKey.includes('glass_2')) {
                        glassMaterials.row2.push(glassMat);
                    }
                    else if (glassKey.includes('glass_roof_panorama') || glassKey.includes('roof')) {
                        glassMaterials.sunroof.push(glassMat);
                    }
                }
            }
        });

        scene.add(model);

        // 4. 블렌더의 오리진(Origin) 좌표를 회전 및 뷰포인트 기준으로 사용
        const originPoint = new THREE.Vector3(0, 0.6, 0); // Y축 0.6은 바닥이 아닌 차량 중간을 바라보도록 하는 미세 조정값입니다.
        
        controls.target.copy(originPoint);
        controls.update();

        // 외부 시점 기준도 오리진 포인트 기준으로 세팅
        extTargetPos.copy(originPoint);
        extCameraPos.set(originPoint.x + 4, originPoint.y + 1.6, originPoint.z + 4);
        camera.position.copy(extCameraPos);

        // 초기 색상 적용
        if (carBodyMaterials.length > 0) {
            carBodyMaterials.forEach(mat => mat.color.setHex(0x3e4247)); 
        }
        
        // 초기 실내 색상 적용: 기본 블랙 버튼 기준으로 시트는 내장재와 같은 색상
        updateSeatColor(INTERIOR_TRIM_COLOR);
        
        // 틴팅 적용
        updateAllGlassMaterials();
        
        loadingEl.style.display = 'none';
        } catch (err) {
            console.error('모델 처리 중 오류가 발생했습니다.', err);
            showLoadingMessage('모델 처리 오류: ' + (err.message || err));
        }
    }

    // 모델 로더
    // tesla.glb가 없으면 y_whiteseat.glb도 자동으로 한 번 더 시도합니다.
    const MODEL_FILES = ['glass_front_film.glb', 'teslaglass_front_border.glb', 'tesla.glb', 'y_whiteseat.glb', 'y_whiteseat(1).glb'];

    if (!THREE.GLTFLoader) {
        showLoadingMessage('GLTFLoader 로드 실패! 인터넷/CDN 연결을 확인해주세요.');
    } else {
        const gltfLoader = new THREE.GLTFLoader();

        function loadModelFile(index) {
            const modelFile = MODEL_FILES[index];
            showLoadingMessage('Loading 3D Model... ' + modelFile);

            gltfLoader.load(modelFile, handleModelLoaded,
                function (xhr) {
                    if (xhr.lengthComputable) {
                        loadingEl.innerText = `Loading 3D Model... ${modelFile} ${Math.round(xhr.loaded / xhr.total * 100)}%`;
                    }
                },
                function (error) {
                    console.warn(modelFile + ' 로드 실패', error);
                    if (index + 1 < MODEL_FILES.length) {
                        loadModelFile(index + 1);
                    } else {
                        showLoadingMessage('GLB 로드 실패! GitHub에 glass_front_film.glb 또는 tesla.glb 파일이 있는지 확인해주세요.');
                    }
                }
            );
        }

        loadModelFile(0);
    }

    // 화면 리사이즈
    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight, false);
    }

    // 애니메이션 렌더링 루프
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    // --- UI 이벤트 리스너들 ---

    // 1. 차량 색상 변경 (배열 기반 수정 적용)
    const colorBtns = document.querySelectorAll('.color-btn');
    const colorNameDisplay = document.getElementById('selected-color-name');

    colorBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            colorBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            
            const colorName = e.target.getAttribute('data-color');
            const hexColor = e.target.getAttribute('data-hex');
            colorNameDisplay.textContent = colorName;

            if (carBodyMaterials.length > 0) {
                carBodyMaterials.forEach(mat => {
                    mat.color.set(hexColor);
                });
            }
        });
    });

    // 2. 실내 색상 변경
    const interiorBtns = document.querySelectorAll('.interior-btn');
    interiorBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            interiorBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            
            const interiorColor = e.target.getAttribute('data-color');

            if (interiorColor === 'white') {
                // 화이트 버튼: 시트만 화이트, 내장재는 다크 유지
                updateSeatColor(WHITE_SEAT_COLOR);
            } else {
                // 블랙 버튼: 시트를 내장재와 같은 색상으로 변경
                updateSeatColor(INTERIOR_TRIM_COLOR);
            }
        });
    });

    // 3. 카메라(시점) 변경
    const cameraBtns = document.querySelectorAll('.camera-btn');
    let extCameraPos = new THREE.Vector3(4, 2, 5);
    let extTargetPos = new THREE.Vector3(0, 0.6, 0);

    cameraBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            cameraBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');

            const viewMode = e.target.getAttribute('data-view');
            currentViewMode = viewMode;

            if (viewMode === 'exterior') {
                // 외부 시점
                camera.position.copy(extCameraPos);
                controls.target.copy(extTargetPos);

                controls.minDistance = 2;
                controls.maxDistance = 10;
                controls.enableZoom = true;
                controls.enablePan = true;
                controls.rotateSpeed = 1.0;
                controls.maxPolarAngle = Math.PI / 2 - 0.03;

                // 외부에서는 유리창을 다시 켜고 원래 썬팅 농도로 복구
                restoreExteriorGlassView();
            } else {
                // 내부 시점 들어가기 전 현재 외부 위치 저장
                extCameraPos.copy(camera.position);
                extTargetPos.copy(controls.target);

                // 첫 번째 파일의 운전석 위치 적용
                const driverHeadPos = new THREE.Vector3(0.4, 1.4, 0.2); 
                controls.target.copy(driverHeadPos);
                
                // 카메라 위치를 운전석 위치와 거의 동일하게 설정
                camera.position.set(driverHeadPos.x, driverHeadPos.y + 0.0036, driverHeadPos.z - 0.01);
                
                controls.minDistance = 0.01;
                controls.maxDistance = 0.01;
                controls.enableZoom = false;
                controls.enablePan = false;
                controls.rotateSpeed = -0.5; 
                controls.maxPolarAngle = Math.PI;

                // 내부에서는 유리창을 숨기지 않고 내부 전용 농도표를 적용
                setInteriorGlassView();
            }

            controls.update();
        });
    });

    // 4. 필름 타입 선택 토글
    const filmTypeBtns = document.querySelectorAll('.film-type-btn');
    filmTypeBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            filmTypeBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');

            currentFilmType = e.target.getAttribute('data-type');
            if (currentViewMode === 'interior') {
                setInteriorGlassView();
            } else {
                updateAllGlassMaterials();
            }
        });
    });

    // 5. 틴팅 농도 변경
    const tintGroups = document.querySelectorAll('.tint-options');
    tintGroups.forEach(group => {
        const buttons = group.querySelectorAll('.tint-btn');
        const partName = group.getAttribute('data-part');

        buttons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                buttons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');

                const tintValue = parseInt(e.target.getAttribute('data-value'));
                glassTintValues[partName] = tintValue;

                if (glassMaterials[partName]) {
                    if (currentViewMode === 'interior') {
                        setInteriorGlassView();
                    } else {
                        glassMaterials[partName].forEach(mat => {
                            applyGlassProperties(mat, partName, tintValue, currentFilmType);
                        });
                    }
                }
            });
        });
    });

    // 6. 배경 및 시간 토글 (낮/밤)
    const timeBtns = document.querySelectorAll('.time-btn');
    const carDisplay = document.getElementById('car-display');

    timeBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            timeBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');

            const timeMode = e.target.getAttribute('data-time');
            
            if (timeMode === 'day') {
                if (dayExrTexture) {
                    scene.environment = dayExrTexture;
                    scene.background = null;
                    if (hdriBackgroundSphere) hdriBackgroundSphere.visible = true;
                } else {
                    scene.background = new THREE.Color(0xffffff);
                }
                carDisplay.style.backgroundColor = '#ffffff';
                
                ambientLight.intensity = 0.1;
                dirLight.intensity = 1.0;
                topLight.intensity = 0.5;
                interiorLight.intensity = 0.1;
                
                if(dayExrTexture) {
                    renderer.toneMappingExposure = 1.0;
                }
                
                if(neonGroup) neonGroup.visible = false;
            } else {
                if (dayExrTexture) {
                    scene.environment = dayExrTexture;
                    scene.background = null;
                    if (hdriBackgroundSphere) hdriBackgroundSphere.visible = true;
                } else {
                    scene.background = new THREE.Color(0x0a0f1c);
                }
                carDisplay.style.backgroundColor = '#0a0f1c';
                // 밤 배경은 어둡게 유지하고, 별도 가로등 광원/글로우로 분위기만 더합니다.
                
                // 원래처럼 어두운 야간 노출은 유지하되,
                // 소수의 따뜻한 조명만 추가해 가로등이 켜진 듯한 분위기를 만듭니다.
                ambientLight.intensity = 0.03;
                dirLight.intensity = 0.22;
                topLight.intensity = 0.08;
                interiorLight.intensity = 0.10;

                if(scene.environment) {
                    // 사용자가 원한 기존 어두운 야간 노출 수준
                    renderer.toneMappingExposure = 0.10;
                }

                // 밤 모드에서는 모바일 렌더링 배율을 조금 더 낮춰 프레임 드랍 방지
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobileDevice ? 1.10 : 1.75));
                renderer.setSize(container.clientWidth, container.clientHeight, false);

                if(neonGroup) neonGroup.visible = true;
                if(nightGlowGroup) nightGlowGroup.visible = true;
            }
        });
    });

    // ==========================================
    // 모바일: 차량 3D 화면을 스크롤 시 상단 고정
    // ==========================================
    (function setupMobileCarSticky() {
        const carDisplayMobile = document.getElementById('car-display');
        if (!carDisplayMobile) return;

        const mobileQuery = window.matchMedia('(max-width: 760px)');
        const placeholder = document.createElement('div');
        placeholder.className = 'mobile-car-placeholder';
        carDisplayMobile.insertAdjacentElement('afterend', placeholder);

        let stickyStartY = 0;
        let rafPending = false;

        function getStickyStart() {
            // 고정 중에는 placeholder가 원래 차량 위치를 나타냅니다.
            const anchor = carDisplayMobile.classList.contains('mobile-car-fixed')
                ? placeholder
                : carDisplayMobile;
            return anchor.getBoundingClientRect().top + window.scrollY;
        }

        function releaseSticky() {
            carDisplayMobile.classList.remove('mobile-car-fixed');
            placeholder.classList.remove('active');
            placeholder.style.height = '0px';
        }

        function measure() {
            if (!mobileQuery.matches) {
                releaseSticky();
                return;
            }

            // 먼저 일반 위치에서 기준점을 정확히 측정
            const wasFixed = carDisplayMobile.classList.contains('mobile-car-fixed');
            if (wasFixed) {
                carDisplayMobile.classList.remove('mobile-car-fixed');
                placeholder.classList.remove('active');
                placeholder.style.height = '0px';
            }

            stickyStartY = carDisplayMobile.getBoundingClientRect().top + window.scrollY;

            updateSticky();
        }

        function updateSticky() {
            if (!mobileQuery.matches) {
                releaseSticky();
                return;
            }

            const shouldFix = window.scrollY >= stickyStartY;

            if (shouldFix) {
                if (!carDisplayMobile.classList.contains('mobile-car-fixed')) {
                    // 고정 전 실제 높이를 저장해 아래 콘텐츠가 위로 튀지 않게 유지
                    const currentHeight = carDisplayMobile.getBoundingClientRect().height;
                    placeholder.style.height = currentHeight + 'px';
                    placeholder.classList.add('active');
                    carDisplayMobile.classList.add('mobile-car-fixed');
                }
            } else {
                if (carDisplayMobile.classList.contains('mobile-car-fixed')) {
                    releaseSticky();
                }
            }
        }

        function onScroll() {
            if (rafPending) return;
            rafPending = true;
            requestAnimationFrame(() => {
                updateSticky();
                rafPending = false;
            });
        }

        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', () => {
            clearTimeout(window.__mobileCarStickyResizeTimer);
            window.__mobileCarStickyResizeTimer = setTimeout(measure, 120);
        });

        if (mobileQuery.addEventListener) {
            mobileQuery.addEventListener('change', measure);
        } else if (mobileQuery.addListener) {
            mobileQuery.addListener(measure);
        }

        window.addEventListener('load', () => {
            setTimeout(measure, 150);
        });

        // DOM/폰트가 이미 로드된 경우에도 즉시 한 번 측정
        setTimeout(measure, 0);
    })();

</script>
