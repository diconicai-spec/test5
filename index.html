<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Model Y Juniper 3D Configurator with HDRI</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
        }

        .left-panel {
            flex: 1;
            min-width: 500px;
        }

        .header-title {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
        }

        .header-title h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
        }

        .header-title p {
            margin: 5px 0 0 0;
            font-size: 20px;
            color: var(--text-muted);
        }

        .btn-share {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
        }

        .options-row {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .option-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-group label {
            font-size: 14px;
            font-weight: 600;
        }

        select {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 150px;
            outline: none;
        }

        .color-palette {
            display: flex;
            gap: 10px;
        }

        .color-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            outline: 2px solid transparent;
            outline-offset: 2px;
            transition: all 0.2s;
        }

        .color-btn.active {
            outline-color: var(--primary-color);
        }

        .toggle-group {
            display: flex;
            gap: 8px;
        }

        .time-btn, .interior-btn, .camera-btn, .film-type-btn {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: white;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .time-btn.active, .camera-btn.active, .film-type-btn.active {
            background-color: #1e293b;
            color: white;
            border-color: #1e293b;
        }

        .time-btn[data-time="day"].active {
            background-color: #f59e0b;
            border-color: #f59e0b;
        }

        .interior-btn[data-color="black"].active {
            background-color: #1e293b;
            color: white;
            border-color: #1e293b;
        }

        .interior-btn[data-color="white"].active {
            background-color: #f1f5f9;
            color: #0f172a;
            border-color: #94a3b8;
        }

        .car-display {
            position: relative;
            width: 100%;
            height: 500px;
            background-color: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: background-color 0.5s ease;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }

        .right-panel {
            width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            margin-top: 0;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .product-select {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid var(--primary-color);
            border-radius: 12px;
            background-color: #eff6ff;
        }

        .film-type-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px dashed var(--border-color);
        }

        .tint-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .tint-row:last-child {
            margin-bottom: 0;
        }

        .tint-label {
            width: 60px;
            font-weight: 600;
            font-size: 14px;
        }

        .tint-options {
            display: flex;
            gap: 8px;
        }

        .tint-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background-color: #f1f5f9;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tint-btn:hover {
            background-color: #e2e8f0;
        }

        .tint-btn.active {
            background-color: var(--primary-color);
            color: white;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            pointer-events: none;
            z-index: 10;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    <!-- GLB 모델을 로드하기 위한 GLTFLoader 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

<div class="container">
    <div class="left-panel">
        <div class="header-title">
            <div>
                <h1>Tesla Model Y Juniper</h1>
                <p id="selected-color-name">스텔스 그레이</p>
            </div>
            <button class="btn-share">공유하기</button>
        </div>

        <div class="options-row">
            <div class="option-group">
                <label>브랜드</label>
                <select>
                    <option>테슬라</option>
                </select>
            </div>
            
            <div class="option-group">
                <label>모델</label>
                <select>
                    <option>모델 Y 주니퍼</option>
                    <option>모델 YL</option>
                    <option>모델 3</option>
                </select>
            </div>

            <div class="option-group">
                <label>실내색상</label>
                <div class="toggle-group">
                    <button class="interior-btn active" data-color="black">블랙</button>
                    <button class="interior-btn" data-color="white">화이트</button>
                </div>
            </div>

            <div class="option-group">
                <label>시점</label>
                <div class="toggle-group">
                    <button class="camera-btn active" data-view="exterior">외부</button>
                    <button class="camera-btn" data-view="interior">내부</button>
                </div>
            </div>

            <div class="option-group">
                <label>차량색상</label>
                <div class="color-palette">
                    <div class="color-btn active" style="background-color: #3e4247;" data-color="스텔스 그레이" data-hex="#3e4247"></div>
                    <div class="color-btn" style="background-color: #ffffff; border: 1px solid #ccc;" data-color="펄 화이트" data-hex="#ffffff"></div>
                    <div class="color-btn" style="background-color: #000000;" data-color="솔리드 블랙" data-hex="#050505"></div>
                    <div class="color-btn" style="background-color: #0d203f;" data-color="딥 블루" data-hex="#0d203f"></div>
                    <div class="color-btn" style="background-color: #931922;" data-color="울트라 레드" data-hex="#8a0b16"></div>
                    <div class="color-btn" style="background-color: #a5a9ac;" data-color="퀵실버" data-hex="#8c9095"></div>
                </div>
            </div>
            
            <div class="option-group" style="margin-left: auto;">
                <label>배경(시간)</label>
                <div class="toggle-group">
                    <button class="time-btn active" data-time="day">☀️ 낮</button>
                    <button class="time-btn" data-time="night">🌙 밤</button>
                </div>
            </div>
        </div>

        <div class="car-display" id="car-display">
            <div id="loading">Loading Model & Environment...</div>
            <div id="canvas-container"></div>
        </div>
    </div>

    <div class="right-panel">
        <div class="card">
            <h2>썬팅(틴팅) 선택</h2>
            
            <div class="product-select">
                <input type="checkbox" checked style="width: 20px; height: 20px; accent-color: var(--primary-color);">
                <div>
                    <div style="font-weight: 700;">디코닉 럭스</div>
                    <div style="font-weight: 700; font-size: 18px;">950,000원</div>
                </div>
            </div>

            <div class="film-type-row">
                <span style="font-weight: 700; font-size: 14px;">필름 타입</span>
                <div class="toggle-group">
                    <button class="film-type-btn" data-type="non-reflective">비반사 (차콜)</button>
                    <button class="film-type-btn active" data-type="reflective">반사 (메탈릭)</button>
                </div>
            </div>

            <div class="tint-row">
                <div class="tint-label">전면</div>
                <div class="tint-options" data-part="front">
                    <button class="tint-btn" data-value="70">70%</button>
                    <button class="tint-btn" data-value="50">50%</button>
                    <button class="tint-btn" data-value="30">30%</button>
                    <button class="tint-btn active" data-value="22">22%</button>
                    <button class="tint-btn" data-value="15">15%</button>
                    <button class="tint-btn" data-value="5">5%</button>
                </div>
            </div>

            <div class="tint-row">
                <div class="tint-label">1열</div>
                <div class="tint-options" data-part="row1">
                    <button class="tint-btn" data-value="70">70%</button>
                    <button class="tint-btn" data-value="50">50%</button>
                    <button class="tint-btn" data-value="30">30%</button>
                    <button class="tint-btn" data-value="22">22%</button>
                    <button class="tint-btn active" data-value="15">15%</button>
                    <button class="tint-btn" data-value="5">5%</button>
                </div>
            </div>

            <div class="tint-row">
                <div class="tint-label">2열</div>
                <div class="tint-options" data-part="row2">
                    <button class="tint-btn" data-value="70">70%</button>
                    <button class="tint-btn" data-value="50">50%</button>
                    <button class="tint-btn" data-value="30">30%</button>
                    <button class="tint-btn" data-value="22">22%</button>
                    <button class="tint-btn active" data-value="15">15%</button>
                    <button class="tint-btn" data-value="5">5%</button>
                </div>
            </div>

            <div class="tint-row">
                <div class="tint-label">후면</div>
                <div class="tint-options" data-part="rear">
                    <button class="tint-btn" data-value="70">70%</button>
                    <button class="tint-btn" data-value="50">50%</button>
                    <button class="tint-btn" data-value="30">30%</button>
                    <button class="tint-btn" data-value="22">22%</button>
                    <button class="tint-btn active" data-value="15">15%</button>
                    <button class="tint-btn" data-value="5">5%</button>
                </div>
            </div>

            <div class="tint-row">
                <div class="tint-label">썬루프</div>
                <div class="tint-options" data-part="sunroof">
                    <button class="tint-btn" data-value="70">70%</button>
                    <button class="tint-btn" data-value="50">50%</button>
                    <button class="tint-btn" data-value="30">30%</button>
                    <button class="tint-btn" data-value="22">22%</button>
                    <button class="tint-btn" data-value="15">15%</button>
                    <button class="tint-btn active" data-value="5">5%</button> 
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- Three.js Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(4, 2, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0; 
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 2;
    controls.maxDistance = 10;

    controls.target.set(0, 0.6, 0);                       
    controls.maxPolarAngle = Math.PI / 2 - 0.03;           

    let dayExrTexture = null;

    // 조명 세팅
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.1); 
    scene.add(ambientLight);
    
    const dirLight = new THREE.DirectionalLight(0xfffaeb, 1.0);
    dirLight.position.set(8, 6, 5); 
    scene.add(dirLight);

    const topLight = new THREE.DirectionalLight(0xffffff, 0.5);
    topLight.position.set(0, 10, 0);
    scene.add(topLight);

    const interiorLight = new THREE.PointLight(0xffecc4, 0, 3);
    interiorLight.position.set(0, 1.0, 0);
    scene.add(interiorLight);

    // 글로벌 매테리얼 변수 (차량 바디 배열로 변경)
    let carBodyMaterials = []; 
    let interiorMaterial = null; 
    let glassMaterials = {
        front: [],
        row1: [],
        row2: [],
        rear: [],
        sunroof: []
    };

    let glassTintValues = {
        front: 22,
        row1: 15,
        row2: 15,
        rear: 15,
        sunroof: 5
    };

    let currentFilmType = 'reflective';
    let neonGroup;

    // 환경 맵 (HDRI) 로더
    const exrLoader = new THREE.EXRLoader();
    exrLoader.load('https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/4k/quattro_canti_4k.exr', function (texture) {
        texture.mapping = THREE.EquirectangularReflectionMapping;
        dayExrTexture = texture;
        
        scene.environment = dayExrTexture;
        scene.background = dayExrTexture;
        
        updateAllGlassMaterials();
        if (carBodyMaterials.length > 0) {
            carBodyMaterials.forEach(mat => mat.needsUpdate = true);
        }
    });

    // 야간 모드 조명 세팅
    function setupNeonLights() {
        neonGroup = new THREE.Group();
        const xOffsets = [-2.5, 2.5];
        const zPositions = [-3.0, -1.0, 1.0, 3.0];

        xOffsets.forEach(x => {
            zPositions.forEach(z => {
                const light = new THREE.PointLight(0xffffff, 0.5, 4);
                light.position.set(x, 1.25, z);
                neonGroup.add(light);
            });
        });

        const ambientFill = new THREE.PointLight(0xffffff, 0.3, 10);
        ambientFill.position.set(0, 4, 0);
        neonGroup.add(ambientFill);

        scene.add(neonGroup);
        neonGroup.visible = false;
    }
    setupNeonLights();

    // 썬팅 옵션 함수
    function applyGlassProperties(mat, partName, tintValue, filmType) {
        if (!mat) return;

        mat.transparent = true;
        mat.depthWrite = false;
        mat.side = THREE.FrontSide;

        // 1. 색이 날아가는 원인이었던 transmission을 다시 0으로 고정합니다.
        if ('transmission' in mat) mat.transmission = 0;
        if ('ior' in mat) mat.ior = 1.45;
        if ('thickness' in mat) mat.thickness = 0.01;

        let opacityValue;
        let colorValue;

        // 2. 겹쳤을 때 완전 까맣게 변하는 것을 방지하기 위해 농도별 불투명도를 살짝 낮춥니다.
        if (tintValue >= 70) {
            opacityValue = 0.30;
            colorValue = 0x555555;
        } else if (tintValue >= 50) {
            opacityValue = 0.40;
            colorValue = 0x333333;
        } else if (tintValue >= 30) {
            opacityValue = 0.50;
            colorValue = 0x222222;
        } else if (tintValue >= 22) {
            opacityValue = 0.60;
            colorValue = 0x111111;
        } else if (tintValue >= 15) {
            opacityValue = 0.68;
            colorValue = 0x080808;
        } else {
            // 5% 농도: 투명도를 0.75로 타협하여 반대편 창문과 겹쳤을 때의 시야 차단을 완화합니다.
            opacityValue = 0.75; 
            colorValue = 0x030303; // 완전 블랙(0x000000) 대신 아주 어두운 차콜색 사용
        }

        if (filmType === 'reflective') {
            mat.color.setHex(colorValue);
            mat.opacity = opacityValue;
            mat.metalness = 0.4;
            mat.roughness = 0.02;
            mat.envMapIntensity = 1.5; // 반사력 강화
            mat.clearcoat = 1.0;
            mat.clearcoatRoughness = 0.02;
        } else {
            // 3. 비반사 필름이어도 '유리 겉면'의 환경 반사(광택)는 살려야 진짜 유리처럼 보입니다.
            mat.color.setHex(colorValue);
            mat.opacity = Math.min(opacityValue + 0.05, 0.82); // 최대 불투명도를 0.82로 제한
            mat.metalness = 0.05; 
            mat.roughness = 0.02;
            mat.envMapIntensity = 1.2; // 기존 0.45에서 1.2로 대폭 상향 (주변 배경 반사)
            mat.clearcoat = 1.0;       // 기존 0.3에서 1.0으로 상향 (유리 코팅 반사)
            mat.clearcoatRoughness = 0.02;
        }

        if (partName === 'sunroof') {
            mat.opacity = Math.min(mat.opacity + 0.1, 0.90);
        }

        mat.needsUpdate = true;
    }

    function updateAllGlassMaterials() {
        Object.keys(glassMaterials).forEach(part => {
            const tintVal = glassTintValues[part];
            glassMaterials[part].forEach(mat => {
                applyGlassProperties(mat, part, tintVal, currentFilmType);
            });
        });
    }

    // ==========================================
    // 수정된 GLB 로딩 스크립트: 오리진 유지 및 유리 개별 매핑 (배열 기반)
    // ==========================================
    const gltfLoader = new THREE.GLTFLoader();
    const loadingEl = document.getElementById('loading');

    gltfLoader.load('tesla.glb', function(gltf) {
        const model = gltf.scene;

        model.traverse((child) => {
            if (child.isMesh && child.material) {
                // 머테리얼 및 메쉬 이름을 소문자로 가져옵니다.
                const matName = child.material.name.toLowerCase();
                const meshName = child.name.toLowerCase();
                
                // 1. 차량 도장면 (머테리얼 이름: body)
                if (matName.includes('body')) {
                    // 번호판(plate, license) 메쉬가 바디와 재질을 공유할 경우 예외 처리
                    if (!meshName.includes('plate') && !meshName.includes('license')) {
                        const bodyMat = child.material.clone();
                        bodyMat.metalness = 0.4;
                        bodyMat.roughness = 0.2;
                        bodyMat.clearcoat = 0.8;
                        bodyMat.clearcoatRoughness = 0.05;
                        
                        child.material = bodyMat;
                        carBodyMaterials.push(bodyMat); // 색상 제어를 위해 배열에 저장
                    }
                }
                
                // 2. 실내 시트
                if (matName.includes('seat')) {
                    interiorMaterial = child.material;
                }
                
                // 3. 분리된 유리 파트 개별 매핑
                if (matName.includes('glass')) {
                    const glassMat = child.material.clone();

                    glassMat.transparent = true;
                    glassMat.depthWrite = false;
                    glassMat.opacity = 0.35;
                    glassMat.color.setHex(0x111111);
                    glassMat.metalness = 0.05;
                    glassMat.roughness = 0.08;
                    glassMat.envMapIntensity = 0.7;
                    glassMat.needsUpdate = true;

                    child.material = glassMat;

                    // 이름에 포함된 키워드에 따라 썬팅 배열에 각각 할당합니다.
                    if (matName.includes('glass_front')) {
                        glassMaterials.front.push(glassMat);
                    }
                    else if (matName.includes('glass_1')) {
                        glassMaterials.row1.push(glassMat);
                    }
                    else if (matName.includes('glass_2')) {
                        glassMaterials.row2.push(glassMat);
                    }
                    else if (matName.includes('glass_rear')) {
                        glassMaterials.rear.push(glassMat);
                    }
                    else if (matName.includes('glass_roof_panorama')) {
                        glassMaterials.sunroof.push(glassMat);
                    }
                }
            }
        });

        scene.add(model);

        // 4. 블렌더의 오리진(Origin) 좌표를 회전 및 뷰포인트 기준으로 사용
        const originPoint = new THREE.Vector3(0, 0.6, 0); // Y축 0.6은 바닥이 아닌 차량 중간을 바라보도록 하는 미세 조정값입니다.
        
        controls.target.copy(originPoint);
        controls.update();

        // 외부 시점 기준도 오리진 포인트 기준으로 세팅
        extTargetPos.copy(originPoint);
        extCameraPos.set(originPoint.x + 4, originPoint.y + 1.6, originPoint.z + 4);
        camera.position.copy(extCameraPos);

        // 초기 색상 적용
        if (carBodyMaterials.length > 0) {
            carBodyMaterials.forEach(mat => mat.color.setHex(0x3e4247)); 
        }
        
        // 틴팅 적용
        updateAllGlassMaterials();
        
        loadingEl.style.display = 'none';

    }, 
    function (xhr) {
        if (xhr.lengthComputable) {
            loadingEl.innerText = `Loading 3D Model... ${Math.round(xhr.loaded / xhr.total * 100)}%`;
        }
    }, 
    function (error) {
        console.error('GLB 파일을 로드하는 중 에러가 발생했습니다.', error);
        loadingEl.innerText = 'GLB 로드 실패! 콘솔을 확인해주세요.';
    });

    // 화면 리사이즈
    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    }

    // 애니메이션 렌더링 루프
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    // --- UI 이벤트 리스너들 ---

    // 1. 차량 색상 변경 (배열 기반 수정 적용)
    const colorBtns = document.querySelectorAll('.color-btn');
    const colorNameDisplay = document.getElementById('selected-color-name');

    colorBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            colorBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            
            const colorName = e.target.getAttribute('data-color');
            const hexColor = e.target.getAttribute('data-hex');
            colorNameDisplay.textContent = colorName;

            if (carBodyMaterials.length > 0) {
                carBodyMaterials.forEach(mat => {
                    mat.color.set(hexColor);
                });
            }
        });
    });

    // 2. 실내 색상 변경
    const interiorBtns = document.querySelectorAll('.interior-btn');
    interiorBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            interiorBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            
            const interiorColor = e.target.getAttribute('data-color');

            if (interiorMaterial) {
                if (interiorColor === 'white') {
                    interiorMaterial.color.setHex(0xdddddd);
                } else {
                    interiorMaterial.color.setHex(0x111111);
                }
            }
        });
    });

    // 3. 카메라(시점) 변경
    const cameraBtns = document.querySelectorAll('.camera-btn');
    let extCameraPos = new THREE.Vector3(4, 2, 5);
    let extTargetPos = new THREE.Vector3(0, 0.6, 0);

    cameraBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            cameraBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');

            const viewMode = e.target.getAttribute('data-view');

            if (viewMode === 'exterior') {
                // 외부 시점
                camera.position.copy(extCameraPos);
                controls.target.copy(extTargetPos);

                controls.minDistance = 2;
                controls.maxDistance = 10;
                controls.enableZoom = true;
                controls.enablePan = true;
                controls.rotateSpeed = 1.0;
                controls.maxPolarAngle = Math.PI / 2 - 0.03;
            } else {
               // 내부 시점 들어가기 전 현재 외부 위치 저장
                extCameraPos.copy(camera.position);
                extTargetPos.copy(controls.target);

                // 첫 번째 파일의 운전석 위치 적용
                const driverHeadPos = new THREE.Vector3(0.4, 1.4, 0.2); 
                controls.target.copy(driverHeadPos);
                
                // 카메라 위치를 운전석 위치와 거의 동일하게(아주 미세한 차이만 두어) 설정
                camera.position.set(driverHeadPos.x, driverHeadPos.y + 0.0036, driverHeadPos.z - 0.01);
                
                // 카메라가 위치에서 벗어나지 않도록 거리 제한 축소
                controls.minDistance = 0.01;
                controls.maxDistance = 0.01;
                
                controls.enableZoom = false;
                controls.enablePan = false;
                controls.rotateSpeed = -0.5; 
                controls.maxPolarAngle = Math.PI;
            }

            controls.update();
        });
    });

    // 4. 필름 타입 선택 토글
    const filmTypeBtns = document.querySelectorAll('.film-type-btn');
    filmTypeBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            filmTypeBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');

            currentFilmType = e.target.getAttribute('data-type');
            updateAllGlassMaterials();
        });
    });

    // 5. 틴팅 농도 변경
    const tintGroups = document.querySelectorAll('.tint-options');
    tintGroups.forEach(group => {
        const buttons = group.querySelectorAll('.tint-btn');
        const partName = group.getAttribute('data-part');

        buttons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                buttons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');

                const tintValue = parseInt(e.target.getAttribute('data-value'));
                glassTintValues[partName] = tintValue;

                if (glassMaterials[partName]) {
                    glassMaterials[partName].forEach(mat => {
                        applyGlassProperties(mat, partName, tintValue, currentFilmType);
                    });
                }
            });
        });
    });

    // 6. 배경 및 시간 토글 (낮/밤)
    const timeBtns = document.querySelectorAll('.time-btn');
    const carDisplay = document.getElementById('car-display');

    timeBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            timeBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');

            const timeMode = e.target.getAttribute('data-time');
            
            if (timeMode === 'day') {
                scene.background = dayExrTexture || new THREE.Color(0xffffff);
                scene.environment = dayExrTexture;
                carDisplay.style.backgroundColor = '#ffffff';
                
                ambientLight.intensity = 0.1;
                dirLight.intensity = 1.0;
                topLight.intensity = 0.5;
                interiorLight.intensity = 0.2;
                
                if(dayExrTexture) {
                    renderer.toneMappingExposure = 1.0;
                }
                
                if(neonGroup) neonGroup.visible = false;
            } else {
                scene.background = dayExrTexture || new THREE.Color(0x0a0f1c);
                scene.environment = dayExrTexture;
                carDisplay.style.backgroundColor = '#0a0f1c';
                
                ambientLight.intensity = 0.02;
                dirLight.intensity = 0.5;
                topLight.intensity = 0.1;
                interiorLight.intensity = 0.2;

                if(scene.environment) {
                    renderer.toneMappingExposure = 0.1;
                }

                if(neonGroup) neonGroup.visible = true;
            }
        });
    });
</script>

</body>
</html>
