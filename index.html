<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Model Y Juniper 3D Configurator with HDRI</title>

    <style>
        :root {
            --primary-color: #172033;
            --accent-color: #2563eb;
            --bg-color: #f3f0ea;
            --card-bg: rgba(255, 255, 255, 0.90);
            --card-solid: #ffffff;
            --text-main: #20242c;
            --text-muted: #7c828d;
            --border-color: rgba(32, 36, 44, 0.10);
            --soft-bg: rgba(255,255,255,0.68);
            --shadow-soft: 0 18px 50px rgba(31, 35, 42, 0.10);
            --shadow-card: 0 12px 34px rgba(31, 35, 42, 0.09);
        }

        * { box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 26px;
            background:
                radial-gradient(circle at 38% 12%, rgba(255,255,255,0.96) 0, rgba(255,255,255,0.62) 24%, rgba(243,240,234,0) 50%),
                linear-gradient(180deg, #f7f5f1 0%, #efede8 100%);
        }

        .container {
            max-width: 1540px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 390px;
            gap: 26px;
            align-items: start;
        }

        .left-panel {
            min-width: 0;
            position: relative;
        }

        .header-title {
            min-height: 72px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 16px;
            padding: 0 6px;
        }

        .header-title > div:first-child {
            display: flex;
            align-items: baseline;
            gap: 14px;
            flex-wrap: wrap;
        }

        .header-title h1 {
            margin: 0;
            font-size: clamp(25px, 2vw, 34px);
            line-height: 1;
            font-weight: 800;
            letter-spacing: -0.7px;
        }

        .header-title p {
            margin: 0;
            font-size: 15px;
            color: var(--text-muted);
            font-weight: 650;
        }

        .btn-share {
            border: 1px solid rgba(32,36,44,0.09);
            padding: 10px 17px;
            border-radius: 999px;
            background: rgba(255,255,255,0.82);
            color: var(--text-main);
            font-weight: 750;
            cursor: pointer;
            box-shadow: 0 7px 22px rgba(31,35,42,0.05);
            backdrop-filter: blur(14px);
            transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
        }

        .btn-share:hover {
            transform: translateY(-1px);
            background: #fff;
            box-shadow: 0 10px 28px rgba(31,35,42,0.10);
        }

        .options-row {
            display: grid;
            grid-template-columns: 1fr 1.25fr auto auto;
            gap: 12px;
            align-items: end;
            margin-bottom: 14px;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.75);
            border-radius: 20px;
            background: rgba(255,255,255,0.70);
            box-shadow: 0 10px 30px rgba(31,35,42,0.06);
            backdrop-filter: blur(20px);
        }

        .option-group {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .option-group label,
        .deck-label {
            font-size: 11px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: .02em;
            color: #858a93;
        }

        select {
            width: 100%;
            min-width: 120px;
            height: 42px;
            padding: 0 34px 0 13px;
            border: 1px solid rgba(32,36,44,0.10);
            border-radius: 12px;
            outline: none;
            background: rgba(255,255,255,0.90);
            color: var(--text-main);
            font-weight: 700;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.75);
        }

        select:focus {
            border-color: rgba(37,99,235,0.55);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
        }

        .toggle-group {
            display: flex;
            gap: 5px;
            padding: 4px;
            border-radius: 12px;
            background: rgba(31,35,42,0.055);
        }

        .time-btn, .interior-btn, .camera-btn, .film-type-btn {
            min-height: 34px;
            padding: 7px 13px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: #737986;
            font-size: 13px;
            font-weight: 750;
            cursor: pointer;
            transition: all .2s ease;
            white-space: nowrap;
        }

        .time-btn:hover, .interior-btn:hover, .camera-btn:hover, .film-type-btn:hover {
            color: var(--text-main);
            background: rgba(255,255,255,0.72);
        }

        .time-btn.active, .camera-btn.active, .film-type-btn.active {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 6px 16px rgba(23,32,51,0.18);
        }

        .time-btn[data-time="day"].active {
            background: #e3a315;
            color: #fff;
            box-shadow: 0 6px 16px rgba(227,163,21,0.22);
        }

        .interior-btn[data-color="black"].active {
            background: #20242c;
            color: white;
            box-shadow: 0 6px 16px rgba(23,32,51,0.16);
        }

        .interior-btn[data-color="white"].active {
            background: white;
            color: #20242c;
            box-shadow: 0 5px 14px rgba(31,35,42,0.10);
        }

        .car-display {
            position: relative;
            width: 100%;
            height: min(67vh, 690px);
            min-height: 560px;
            border-radius: 28px;
            background:
                radial-gradient(ellipse at center, #ffffff 0%, #f1eee7 70%, #e9e6df 100%);
            box-shadow: var(--shadow-soft);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.75);
            transition: background-color 0.5s ease;
        }

        .car-display::after {
            content: "";
            position: absolute;
            inset: auto 7% 5% 7%;
            height: 18%;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(31,35,42,.12), rgba(31,35,42,0) 70%);
            filter: blur(18px);
            pointer-events: none;
            z-index: 0;
        }

        #canvas-container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: block;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        .stage-control-deck {
            width: min(880px, calc(100% - 40px));
            margin: -32px auto 0;
            min-height: 82px;
            position: relative;
            z-index: 20;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 18px;
            align-items: center;
            padding: 13px 16px 13px 20px;
            border: 1px solid rgba(255,255,255,0.80);
            border-radius: 24px;
            background: rgba(255,255,255,0.86);
            box-shadow: 0 18px 38px rgba(31,35,42,0.13);
            backdrop-filter: blur(20px);
        }

        .deck-section {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .deck-divider {
            width: 1px;
            height: 42px;
            background: rgba(32,36,44,0.10);
        }

        .color-palette {
            display: flex;
            align-items: center;
            gap: 11px;
            min-width: 0;
            flex-wrap: wrap;
        }

        .color-btn {
            width: 38px;
            height: 38px;
            flex: 0 0 38px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,.95);
            cursor: pointer;
            outline: 1px solid rgba(31,35,42,0.14);
            outline-offset: 2px;
            box-shadow: 0 4px 10px rgba(31,35,42,0.10);
            transition: transform .18s ease, box-shadow .18s ease, outline-color .18s ease;
        }

        .color-btn:hover { transform: translateY(-2px) scale(1.04); }

        .color-btn.active {
            transform: translateY(-2px) scale(1.08);
            outline: 3px solid var(--accent-color);
            outline-offset: 3px;
            box-shadow: 0 7px 17px rgba(31,35,42,0.16);
        }

        .right-panel {
            width: 390px;
            position: sticky;
            top: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.82);
            border-radius: 26px;
            padding: 24px;
            box-shadow: var(--shadow-card);
            backdrop-filter: blur(22px);
        }

        .card h2 {
            margin: 0 0 18px;
            font-size: 19px;
            letter-spacing: -0.3px;
        }

        .product-select {
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
            padding: 17px;
            border: 1px solid rgba(37,99,235,0.28);
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(238,245,255,.98), rgba(255,255,255,.96));
            box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
        }

        .product-select::after {
            content: "SELECTED";
            position: absolute;
            right: 14px;
            top: 13px;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: .11em;
            color: var(--accent-color);
            opacity: .75;
        }

        .product-select input[type="checkbox"] {
            width: 20px !important;
            height: 20px !important;
            accent-color: var(--accent-color) !important;
        }

        .film-type-row {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
            margin-bottom: 17px;
            padding-bottom: 17px;
            border-bottom: 1px solid rgba(32,36,44,0.08);
        }

        .film-type-row .toggle-group { width: 100%; }
        .film-type-row .film-type-btn { flex: 1; }

        .tint-row {
            display: grid;
            grid-template-columns: 46px minmax(0,1fr);
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .tint-row:last-child { margin-bottom: 0; }

        .tint-label {
            width: auto;
            font-weight: 800;
            font-size: 13px;
            color: #3f4650;
        }

        .tint-options {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
        }

        .tint-btn {
            aspect-ratio: 1 / 1;
            width: 100%;
            min-width: 0;
            max-width: 42px;
            justify-self: center;
            border-radius: 50%;
            border: 1px solid transparent;
            background: #f0f1f3;
            color: #858b96;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: transform .18s ease, background .18s ease, color .18s ease, box-shadow .18s ease;
        }

        .tint-btn:hover {
            transform: translateY(-1px);
            background: #e5e7eb;
            color: #535964;
        }

        .tint-btn.active {
            transform: translateY(-1px);
            background: var(--accent-color);
            color: white;
            box-shadow: 0 7px 15px rgba(37,99,235,.22);
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1rem;
            font-weight: 800;
            color: var(--primary-color);
            padding: 10px 15px;
            border-radius: 999px;
            background: rgba(255,255,255,.84);
            box-shadow: 0 8px 22px rgba(31,35,42,.08);
            backdrop-filter: blur(12px);
            pointer-events: none;
            z-index: 30;
        }

        @media (max-width: 1180px) {
            body { padding: 18px; }
            .container { grid-template-columns: 1fr; max-width: 1050px; }
            .right-panel { width: 100%; position: static; }
            .card { padding: 22px; }
            .car-display { height: 620px; }
            .tint-options { grid-template-columns: repeat(6, minmax(38px, 44px)); justify-content: start; }
        }

        @media (max-width: 760px) {
            body { padding: 12px; }
            .container { display: block; max-width: none; }
            .left-panel { display: block; min-width: 0; }
            .header-title { min-height: auto; margin: 0 0 10px; padding: 8px 3px 2px; }
            .header-title h1 { font-size: 22px; }
            .header-title p { width: 100%; font-size: 13px; }
            .btn-share { padding: 9px 13px; }
            .options-row { grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; padding: 11px; }
            
            .car-display {
                width: 100%;
                height: 58vh;
                min-height: 430px;
                max-height: 780px;
                margin: 0;
                border-radius: 20px;
                box-shadow: 0 14px 36px rgba(31,35,42,0.16);
            }

            .car-display.mobile-car-fixed {
                position: fixed !important;
                top: 0 !important;
                left: 12px !important;
                right: 12px !important;
                width: auto !important;
                z-index: 5000 !important;
                margin: 0 !important;
                border-radius: 0 0 20px 20px;
                box-shadow: 0 16px 38px rgba(31,35,42,0.22);
            }

            .mobile-car-placeholder { display: none; width: 100%; }
            .mobile-car-placeholder.active { display: block; }

            .stage-control-deck {
                width: 100%; margin: 12px 0 14px; grid-template-columns: 1fr; gap: 12px; border-radius: 20px; padding: 14px;
            }
            .deck-divider { display: none; }
            .stage-control-deck .toggle-group { justify-self: stretch; width: 100%; }
            .stage-control-deck .time-btn { flex: 1; }
            .color-palette { gap: 10px; justify-content: space-between; flex-wrap: nowrap; }
            .color-btn { width: 34px; height: 34px; flex-basis: 34px; }
            
            .right-panel { width: 100%; margin-top: 0; position: static; }
            .card { border-radius: 22px; padding: 18px 14px 28px; }
            .film-type-row .toggle-group { width: 100%; }
            .tint-row { grid-template-columns: 42px minmax(0,1fr); gap: 6px; }
            .tint-options { gap: 4px; grid-template-columns: repeat(6, 1fr); }
            .tint-btn { max-width: 40px; font-size: 10px; }
        }

        .option-group .toggle-group:has(.interior-btn),
        .option-group .toggle-group:has(.camera-btn),
        .stage-control-deck .toggle-group,
        .film-type-row .toggle-group {
            background: #ffffff !important;
            border: 1px solid #e5e5e5 !important;
            padding: 4px !important;
        }

        .interior-btn, .camera-btn, .time-btn, .film-type-btn {
            background: #ffffff !important;
            color: #111111 !important;
            border: 0 !important;
            box-shadow: none !important;
        }

        .interior-btn.active, .camera-btn.active, .film-type-btn.active,
        .interior-btn[data-color="black"].active, .interior-btn[data-color="white"].active,
        .time-btn.active, .time-btn[data-time="day"].active, .time-btn[data-time="night"].active {
            background: #111111 !important;
            color: #ffffff !important;
            border: 0 !important;
            box-shadow: none !important;
        }

        .interior-btn:hover, .camera-btn:hover, .time-btn:hover, .film-type-btn:hover {
            background: #f7f7f7 !important;
            color: #111111 !important;
        }

        .interior-btn.active:hover, .camera-btn.active:hover, .time-btn.active:hover, .film-type-btn.active:hover {
            background: #111111 !important;
            color: #ffffff !important;
        }

        .tint-btn {
            background: #f3f3f3 !important;
            color: #666666 !important;
            border: 1px solid #ececec !important;
            box-shadow: none !important;
        }

        .tint-btn:hover { background: #ebebeb !important; color: #222222 !important; box-shadow: none !important; }
        .tint-btn.active { background: #111111 !important; color: #ffffff !important; border: 1px solid #111111 !important; box-shadow: none !important; }

        .product-select { background: #ffffff !important; border: 1px solid #dddddd !important; box-shadow: none !important; }
        .product-select::after { color: #666666 !important; }
        .product-select input[type="checkbox"] { accent-color: #111111 !important; }

        .left-panel > .car-display + .options-row { margin-top: 14px !important; margin-bottom: 14px !important; }
        @media (max-width: 760px) {
            .left-panel > .car-display + .options-row,
            .left-panel > .mobile-car-placeholder + .options-row { margin-top: 12px !important; margin-bottom: 14px !important; }
        }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

<div class="container">
    <div class="left-panel">
        <div class="header-title">
            <div>
                <h1>Tesla Model Y Juniper</h1>
                <p id="selected-color-name">스텔스 그레이</p>
            </div>
            <button class="btn-share">공유하기</button>
        </div>

        <div class="car-display" id="car-display">
            <div id="loading">Loading Model & Environment...</div>
            <div id="canvas-container"></div>
        </div>

        <div class="options-row">
            <div class="option-group">
                <label>브랜드</label>
                <select>
                    <option>테슬라</option>
                </select>
            </div>

            <div class="option-group">
                <label>모델</label>
                <select>
                    <option>모델 Y 주니퍼</option>
                    <option>모델 YL</option>
                    <option>모델 3</option>
                </select>
            </div>

            <div class="option-group">
                <label>실내색상</label>
                <div class="toggle-group">
                    <button class="interior-btn active" data-color="black">블랙</button>
                    <button class="interior-btn" data-color="white">화이트</button>
                </div>
            </div>

            <div class="option-group">
                <label>시점</label>
                <div class="toggle-group">
                    <button class="camera-btn active" data-view="exterior">외부</button>
                    <button class="camera-btn" data-view="interior">내부</button>
                </div>
            </div>
        </div>

        <div class="stage-control-deck">
            <div class="deck-section">
                <div class="deck-label">차량 컬러</div>
                <div class="color-palette">
                    <div class="color-btn active" style="background-color: #3e4247;" data-color="스텔스 그레이" data-hex="#3e4247" title="스텔스 그레이"></div>
                    <div class="color-btn" style="background-color: #ffffff;" data-color="펄 화이트" data-hex="#ffffff" title="펄 화이트"></div>
                    <div class="color-btn" style="background-color: #000000;" data-color="솔리드 블랙" data-hex="#050505" title="솔리드 블랙"></div>
                    <div class="color-btn" style="background-color: #0d203f;" data-color="딥 블루" data-hex="#0d203f" title="딥 블루"></div>
                    <div class="color-btn" style="background-color: #931922;" data-color="울트라 레드" data-hex="#8a0b16" title="울트라 레드"></div>
                    <div class="color-btn" style="background-color: #a5a9ac;" data-color="퀵실버" data-hex="#8c9095" title="퀵실버"></div>
                </div>
            </div>

            <div class="deck-divider"></div>

            <div class="deck-section">
                <div class="deck-label">배경</div>
                <div class="toggle-group">
                    <button class="time-btn active" data-time="day">☀ 낮</button>
                    <button class="time-btn" data-time="night">☾ 밤</button>
                </div>
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="card">
            <h2>썬팅(틴팅) 선택</h2>

            <div class="product-select">
                <input type="checkbox" checked>
                <div>
                    <div style="font-weight: 800;">디코닉 럭스</div>
                    <div style="font-weight: 850; font-size: 19px; margin-top: 2px;">950,000원</div>
                </div>
            </div>

            <div class="film-type-row">
                <span style="font-weight: 800; font-size: 12px; color:#858a93;">필름 타입</span>
                <div class="toggle-group">
                    <button class="film-type-btn" data-type="non-reflective">비반사 필름</button>
                    <button class="film-type-btn active" data-type="reflective">반사 필름</button>
                </div>
            </div>

            <div class="tint-row">
                <div class="tint-label">전면</div>
                <div class="tint-options" data-part="front">
                    <button class="tint-btn" data-value="70">70%</button>
                    <button class="tint-btn" data-value="50">50%</button>
                    <button class="tint-btn" data-value="30">30%</button>
                    <button class="tint-btn active" data-value="22">22%</button>
                    <button class="tint-btn" data-value="15">15%</button>
                    <button class="tint-btn" data-value="5">5%</button>
                </div>
            </div>

            <div class="tint-row">
                <div class="tint-label">1열</div>
                <div class="tint-options" data-part="row1">
                    <button class="tint-btn" data-value="70">70%</button>
                    <button class="tint-btn" data-value="50">50%</button>
                    <button class="tint-btn" data-value="30">30%</button>
                    <button class="tint-btn" data-value="22">22%</button>
                    <button class="tint-btn active" data-value="15">15%</button>
                    <button class="tint-btn" data-value="5">5%</button>
                </div>
            </div>

            <div class="tint-row">
                <div class="tint-label">2열</div>
                <div class="tint-options" data-part="row2">
                    <button class="tint-btn" data-value="70">70%</button>
                    <button class="tint-btn" data-value="50">50%</button>
                    <button class="tint-btn" data-value="30">30%</button>
                    <button class="tint-btn" data-value="22">22%</button>
                    <button class="tint-btn active" data-value="15">15%</button>
                    <button class="tint-btn" data-value="5">5%</button>
                </div>
            </div>

            <div class="tint-row">
                <div class="tint-label">후면</div>
                <div class="tint-options" data-part="rear">
                    <button class="tint-btn" data-value="70">70%</button>
                    <button class="tint-btn" data-value="50">50%</button>
                    <button class="tint-btn" data-value="30">30%</button>
                    <button class="tint-btn" data-value="22">22%</button>
                    <button class="tint-btn active" data-value="15">15%</button>
                    <button class="tint-btn" data-value="5">5%</button>
                </div>
            </div>

            <div class="tint-row">
                <div class="tint-label">썬루프</div>
                <div class="tint-options" data-part="sunroof">
                    <button class="tint-btn" data-value="70">70%</button>
                    <button class="tint-btn" data-value="50">50%</button>
                    <button class="tint-btn" data-value="30">30%</button>
                    <button class="tint-btn" data-value="22">22%</button>
                    <button class="tint-btn" data-value="15">15%</button>
                    <button class="tint-btn active" data-value="5">5%</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    window.addEventListener('error', function(e) {
        const el = document.getElementById('loading');
        if (el) {
            el.style.display = 'block';
            el.innerText = '스크립트 오류: ' + (e.message || '알 수 없는 오류');
        }
        console.error(e.error || e.message);
    });
    window.addEventListener('unhandledrejection', function(e) {
        const el = document.getElementById('loading');
        if (el) {
            el.style.display = 'block';
            el.innerText = '로드 오류: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
        }
        console.error(e.reason);
    });

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(4, 2, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0; 
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 2;
    controls.maxDistance = 10;
    controls.target.set(0, 0.6, 0);                       
    controls.maxPolarAngle = Math.PI / 2 - 0.03;           

    let dayExrTexture = null;
    let hdriBackgroundSphere = null;
    const HDRI_ROTATION_Y = Math.PI * 0.25;

    function createOrUpdateHdriBackground(texture) {
        if (!texture) return;
        if (hdriBackgroundSphere) {
            scene.remove(hdriBackgroundSphere);
            if (hdriBackgroundSphere.geometry) hdriBackgroundSphere.geometry.dispose();
            if (hdriBackgroundSphere.material) {
                if (hdriBackgroundSphere.material.map) hdriBackgroundSphere.material.map.dispose();
                hdriBackgroundSphere.material.dispose();
            }
            hdriBackgroundSphere = null;
        }

        const bgTexture = texture.clone();
        bgTexture.mapping = THREE.UVMapping;
        bgTexture.needsUpdate = true;

        const bgGeometry = new THREE.SphereGeometry(50, 64, 32);
        const bgMaterial = new THREE.MeshBasicMaterial({
            map: bgTexture,
            side: THREE.BackSide
        });

        hdriBackgroundSphere = new THREE.Mesh(bgGeometry, bgMaterial);
        hdriBackgroundSphere.rotation.y = HDRI_ROTATION_Y;
        hdriBackgroundSphere.frustumCulled = false;
        hdriBackgroundSphere.renderOrder = -1000;
        scene.add(hdriBackgroundSphere);
        scene.background = null;
    }

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.1); 
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xfffaeb, 1.0);
    dirLight.position.set(8, 6, 5); 
    scene.add(dirLight);
    const topLight = new THREE.DirectionalLight(0xffffff, 0.5);
    topLight.position.set(0, 10, 0);
    scene.add(topLight);
    const interiorLight = new THREE.PointLight(0xffecc4, 0, 3);
    interiorLight.position.set(0, 1.0, 0);
    scene.add(interiorLight);

    let carBodyMaterials = []; 
    let interiorMaterial = null; 
    let interiorMaterials = []; 
    let seatMaterials = []; 
    let interiorTrimMaterials = []; 
    let glassMaterials = { front: [], row1: [], row2: [], rear: [], sunroof: [] };
    let glassMeshes = [];
    let outerGlassMeshes = [];
    let glassBorderMeshes = [];

    let glassTintValues = { front: 22, row1: 15, row2: 15, rear: 15, sunroof: 5 };
    let currentFilmType = 'reflective';
    let currentViewMode = 'exterior';
    let neonGroup;

    const DEFAULT_HDRI_URL = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/4k/quattro_canti_4k.exr';
    if (THREE.EXRLoader) {
        const exrLoader = new THREE.EXRLoader();
        exrLoader.load(DEFAULT_HDRI_URL, function (texture) {
            texture.mapping = THREE.EquirectangularReflectionMapping;
            dayExrTexture = texture;
            scene.environment = dayExrTexture;
            createOrUpdateHdriBackground(dayExrTexture);
            updateAllGlassMaterials();
            if (carBodyMaterials.length > 0) {
                carBodyMaterials.forEach(mat => mat.needsUpdate = true);
            }
        }, undefined, function(error) {
            console.warn('HDRI 로드 실패', error);
            scene.background = new THREE.Color(0xffffff);
        });
    } else {
        scene.background = new THREE.Color(0xffffff);
    }

    function setupNeonLights() {
        neonGroup = new THREE.Group();
        const xOffsets = [-2.5, 2.5];
        const zPositions = [-3.0, -1.0, 1.0, 3.0];
        xOffsets.forEach(x => {
            zPositions.forEach(z => {
                const light = new THREE.PointLight(0xffffff, 0.5, 4);
                light.position.set(x, 1.25, z);
                neonGroup.add(light);
            });
        });
        const ambientFill = new THREE.PointLight(0xffffff, 0.3, 10);
        ambientFill.position.set(0, 4, 0);
        neonGroup.add(ambientFill);
        scene.add(neonGroup);
        neonGroup.visible = false;
    }
    setupNeonLights();

    const INTERIOR_TRIM_COLOR = 0x111111; 
    const WHITE_SEAT_COLOR = 0xdddddd;    

    function applyInteriorMatte(mat) {
        if (!mat) return;
        mat.metalness = 0.0;
        mat.roughness = 0.94;
        mat.envMapIntensity = 0.01;
        if ('clearcoat' in mat) mat.clearcoat = 0.0;
        if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 1.0;
        mat.needsUpdate = true;
    }

    // 바깥유리 셋팅
    function applyOuterGlassMaterial(mat) {
        if (!mat) return;
        const userData = mat.userData || {};
        const outerPart = userData.outerGlassPart || 'front';
        const isInsideFace = userData.isInsideFace || false; 

        mat.color.setHex(0xb8c8c4);
        mat.transparent = true;
        mat.depthTest = true;
        mat.depthWrite = false; 
        mat.depthFunc = THREE.LessEqualDepth;
        mat.alphaTest = 0.0;
        mat.blending = THREE.NormalBlending;
        mat.premultipliedAlpha = false;
        mat.polygonOffset = false;
        mat.polygonOffsetFactor = 0;
        mat.polygonOffsetUnits = 0;

        if (currentViewMode === 'interior') {
            mat.opacity = 0.025;
        } else {
            const isMobile = window.innerWidth <= 760;
            if (['row1', 'row2', 'quarter', 'rear'].includes(outerPart)) {
                mat.color.setHex(0xa6b6b1);
                mat.opacity = isMobile ? 0.18 : 0.14;
            } else {
                mat.opacity = isMobile ? 0.12 : 0.10;
            }
        }

        // 안쪽 면이면 반사광 제거
        if (isInsideFace) {
            mat.metalness = 0.0;
            mat.roughness = 0.4;
            mat.envMapIntensity = 0.05;
            if ('clearcoat' in mat) mat.clearcoat = 0.0;
        } else {
            mat.metalness = 0.0;
            mat.roughness = 0.16;
            mat.envMapIntensity = 0.20;
            if ('clearcoat' in mat) mat.clearcoat = 0.14;
            if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = 0.18;
        }
        
        if ('transmission' in mat) mat.transmission = 0.0;
        if ('ior' in mat) mat.ior = 1.45;
        if ('thickness' in mat) mat.thickness = 0.005;

        mat.needsUpdate = true;
    }

    // 테두리 셋팅
    function applyGlassBorderMaterial(mat) {
        if (!mat) return;
        const isInteriorView = currentViewMode === 'interior';
        
        const userData = mat.userData || {};
        const isInsideFace = userData.isInsideFace || false;

        mat.color.setHex(isInsideFace || isInteriorView ? 0x020202 : 0x0e0e0e);
        mat.transparent = true; 
        mat.opacity = 1.0;
        mat.alphaTest = 0.01;
        mat.depthTest = true;
        mat.depthWrite = false;
        mat.depthFunc = THREE.LessEqualDepth; 
        mat.blending = THREE.NormalBlending;
        mat.premultipliedAlpha = false;
        
        mat.metalness = 0.0;
        mat.roughness = isInsideFace || isInteriorView ? 0.65 : 0.34;
        mat.envMapIntensity = isInsideFace || isInteriorView ? 0.02 : 0.10;
        mat.reflectivity = isInsideFace || isInteriorView ? 0.0 : 0.04;
        
        if ('clearcoat' in mat) mat.clearcoat = isInsideFace || isInteriorView ? 0.02 : 0.18;
        if ('clearcoatRoughness' in mat) mat.clearcoatRoughness = isInsideFace || isInteriorView ? 0.85 : 0.32;
        if ('transmission' in mat) mat.transmission = 0.0;
        if ('ior' in mat) mat.ior = 1.25;
        if ('thickness' in mat) mat.thickness = 0.0;
        
        mat.polygonOffset = false;
        mat.polygonOffsetFactor = 0; 
        mat.polygonOffsetUnits = 0;
        mat.needsUpdate = true;
    }

    // 썬팅 필름 셋팅
    function applyGlassProperties(mat, partName, tintValue, filmType) {
        if (!mat) return;

        const userData = mat.userData || {};
        const isInsideFace = userData.isInsideFace || false;

        mat.transparent = true;
        mat.depthWrite = false; 
        mat.depthFunc = THREE.LessEqualDepth;
        mat.blending = THREE.NormalBlending;
        mat.premultipliedAlpha = false;
        mat.alphaTest = 0.001; 
        mat.polygonOffset = false;
        mat.polygonOffsetFactor = 0; 
        mat.polygonOffsetUnits = 0;  

        if ('transmission' in mat) mat.transmission = 0; 
        if ('ior' in mat) mat.ior = 1.45;
        if ('thickness' in mat) mat.thickness = 0.01;

        let opacityValue;
        if (tintValue >= 70) opacityValue = 0.30;
        else if (tintValue >= 50) opacityValue = 0.44;
        else if (tintValue >= 30) opacityValue = 0.62;
        else if (tintValue >= 22) opacityValue = 0.72;
        else if (tintValue >= 15) opacityValue = 0.80;
        else opacityValue = 0.90;

        if (partName === 'sunroof') {
            if (tintValue >= 70) opacityValue = 0.98;   
            else if (tintValue >= 50) opacityValue = 0.982;
            else if (tintValue >= 30) opacityValue = 0.984;
            else if (tintValue >= 22) opacityValue = 0.986;
            else if (tintValue >= 15) opacityValue = 0.988;
            else opacityValue = 0.99;
        }

        if (currentViewMode === 'interior') {
            if (partName === 'sunroof') {
                if (tintValue >= 70) opacityValue = 0.58;
                else if (tintValue >= 50) opacityValue = 0.60;
                else if (tintValue >= 30) opacityValue = 0.62;
                else if (tintValue >= 22) opacityValue = 0.65;
                else if (tintValue >= 15) opacityValue = 0.67;
                else opacityValue = 0.69;
            } else {
                if (tintValue >= 70) opacityValue = 0.05;
                else if (tintValue >= 50) opacityValue = 0.09;
                else if (tintValue >= 30) opacityValue = 0.16;
                else if (tintValue >= 22) opacityValue = 0.24;
                else if (tintValue >= 15) opacityValue = 0.34;
                else opacityValue = 0.52;
            }
        }

        const isMobileView = window.innerWidth <= 760;
        const mobileOpacityAdjust = (isMobileView && currentViewMode === 'exterior') ? 0.08 : 0;

        mat.color.setHex(0x000000);

        if (partName === 'sunroof' && currentViewMode === 'exterior') {
            mat.opacity = Math.min(opacityValue, 0.99);
            mat.depthTest = true;
            mat.alphaTest = 0.01;
            
            if (isInsideFace) {
                mat.metalness = 0.0;
                mat.roughness = 0.35;
                mat.envMapIntensity = 0.02;
                if ('clearcoat' in mat) mat.clearcoat = 0.0;
                mat.depthWrite = false;
            } else {
                mat.metalness = 0.05;
                mat.roughness = 0.10;
                mat.envMapIntensity = 0.30;
                if ('clearcoat' in mat) {
                    mat.clearcoat = 0.30;
                    mat.clearcoatRoughness = 0.20;
                }
                mat.depthWrite = false;
            }
        } else {
            if (isInsideFace) {
                mat.opacity = Math.min(opacityValue + mobileOpacityAdjust, 0.99);
                mat.metalness = 0.0;
                mat.roughness = 0.35;
                mat.envMapIntensity = 0.02;
                if ('clearcoat' in mat) {
                    mat.clearcoat = 0.02;
                    mat.clearcoatRoughness = 0.4;
                }
            } else {
                if (filmType === 'reflective') {
                    mat.color.setHex(0x182820);
                    mat.opacity = Math.min(opacityValue + 0.04 + mobileOpacityAdjust, 0.96);
                    mat.metalness = 0.32;
                    mat.roughness = 0.09;
                    mat.envMapIntensity = 0.55;
                    if ('clearcoat' in mat) {
                        mat.clearcoat = 0.55;
                        mat.clearcoatRoughness = 0.05;
                    }
                } else {
                    mat.opacity = Math.min(opacityValue + mobileOpacityAdjust, 0.99);
                    mat.metalness = 0.05;
                    mat.roughness = 0.1;
                    mat.envMapIntensity = 0.30;
                    if ('clearcoat' in mat) {
                        mat.clearcoat = 0.30;
                        mat.clearcoatRoughness = 0.20;
                    }
                }
            }
        }
        mat.needsUpdate = true;
    }

    function updateAllGlassMaterials() {
        outerGlassMeshes.forEach(mesh => {
            if (mesh && mesh.material) {
                applyOuterGlassMaterial(mesh.material);
                mesh.visible = true;
            }
        });

        Object.keys(glassMaterials).forEach(part => {
            const tintVal = glassTintValues[part];
            glassMaterials[part].forEach(mat => {
                applyGlassProperties(mat, part, tintVal, currentFilmType);
            });
        });

        glassBorderMeshes.forEach(mesh => {
            if (mesh && mesh.material) {
                applyGlassBorderMaterial(mesh.material);
                mesh.visible = true;
            }
        });
    }

    function setInteriorGlassView() {
        glassMeshes.forEach(mesh => mesh.visible = true);
        updateAllGlassMaterials();
    }

    function restoreExteriorGlassView() {
        glassMeshes.forEach(mesh => mesh.visible = true);
        updateAllGlassMaterials();
    }

    const loadingEl = document.getElementById('loading');
    function showLoadingMessage(message) {
        if (loadingEl) {
            loadingEl.style.display = 'block';
            loadingEl.innerText = message;
        }
    }

    function handleModelLoaded(gltf) {
        try {
        const model = gltf.scene;

        model.traverse((child) => {
            if (child.isMesh && child.material) {
                const matName = child.material.name.toLowerCase();
                const meshName = child.name.toLowerCase();
                
                if (matName.includes('body')) {
                    if (!meshName.includes('plate') && !meshName.includes('license')) {
                        const bodyMat = child.material.clone();
                        bodyMat.metalness = 0.25;
                        bodyMat.roughness = 0.45;
                        bodyMat.clearcoat = 0.35;
                        bodyMat.clearcoatRoughness = 0.25;
                        child.material = bodyMat;
                        carBodyMaterials.push(bodyMat); 
                    }
                }
                
                const interiorKey = matName + ' ' + meshName;
                const isSeatPart = interiorKey.includes('seat');
                const isInteriorTrimPart =
                    interiorKey.includes('interior') || interiorKey.includes('cabin') ||
                    interiorKey.includes('door') || interiorKey.includes('dashboard') ||
                    interiorKey.includes('dash') || interiorKey.includes('panel') ||
                    interiorKey.includes('trim') || interiorKey.includes('leather') ||
                    interiorKey.includes('black');

                const isExcludedInteriorPart =
                    interiorKey.includes('glass') || interiorKey.includes('window') ||
                    interiorKey.includes('windshield') || interiorKey.includes('body') ||
                    interiorKey.includes('paint') || interiorKey.includes('wheel') ||
                    interiorKey.includes('tire') || interiorKey.includes('rim') ||
                    interiorKey.includes('chrome') || interiorKey.includes('metal');

                if ((isSeatPart || isInteriorTrimPart) && !isExcludedInteriorPart) {
                    const interiorMat = child.material.clone();
                    if (isSeatPart) {
                        interiorMat.color.setHex(INTERIOR_TRIM_COLOR);
                        seatMaterials.push(interiorMat);
                        interiorMaterial = interiorMat; 
                    } else {
                        interiorMat.color.setHex(INTERIOR_TRIM_COLOR);
                        interiorTrimMaterials.push(interiorMat);
                    }
                    applyInteriorMatte(interiorMat);
                    child.material = interiorMat;
                    interiorMaterials.push(interiorMat);
                }
                
                const geoName = child.geometry && child.geometry.name ? child.geometry.name.toLowerCase() : '';
                const parentName = child.parent && child.parent.name ? child.parent.name.toLowerCase() : '';
                const glassKey = matName + ' ' + meshName + ' ' + geoName + ' ' + parentName;

                // 1. 테두리 고정 분리 (앞면/뒷면)
                const isGlassBorder = glassKey.includes('glass_border') || geoName === 'object_22.001';
                if (isGlassBorder) {
                    const baseBorderMat = child.material.clone();
                    
                    const borderMatBack = baseBorderMat.clone();
                    borderMatBack.side = THREE.BackSide;
                    borderMatBack.userData = { isInsideFace: true };
                    const borderMeshBack = child.clone();
                    borderMeshBack.material = borderMatBack;
                    borderMeshBack.renderOrder = 22; 

                    const borderMatFront = baseBorderMat.clone();
                    borderMatFront.side = THREE.FrontSide;
                    borderMatFront.userData = { isInsideFace: false };
                    child.material = borderMatFront;
                    child.renderOrder = 23; 

                    child.parent.add(borderMeshBack);
                    glassBorderMeshes.push(borderMeshBack, child);
                    return;
                }

                // 2. 썬루프 (앞면/뒷면)
                const isSunroofGlass = glassKey.includes('glass_roof_panorama') || glassKey.includes('roof');
                if (isSunroofGlass) {
                    const baseGlassMat = child.material.clone();
                    
                    const glassMatBack = baseGlassMat.clone();
                    glassMatBack.side = THREE.BackSide;
                    glassMatBack.userData = { isSunroofGlass: true, isInsideFace: true };
                    const glassMeshBack = child.clone();
                    glassMeshBack.material = glassMatBack;
                    glassMeshBack.renderOrder = 18;

                    const glassMatFront = baseGlassMat.clone();
                    glassMatFront.side = THREE.FrontSide;
                    glassMatFront.userData = { isSunroofGlass: true, isInsideFace: false };
                    child.material = glassMatFront;
                    child.renderOrder = 19;

                    child.parent.add(glassMeshBack);
                    glassMeshes.push(glassMeshBack, child);
                    glassMaterials.sunroof.push(glassMatBack, glassMatFront);
                    return;
                }

                // 3. 유리 안쪽 필름 오브젝트 (앞면/뒷면)
                const isGlassFilm =
                    glassKey.includes('glass_front_film') || glassKey.includes('glass_front1_film') ||
                    glassKey.includes('glass_front2_film') || glassKey.includes('glass_quarter_film') ||
                    glassKey.includes('glass_rear_film') || glassKey.includes('glass_front3_film') ||
                    geoName === 'object_2.001' || geoName === 'object_2.009' || geoName === 'object_2.010' || 
                    geoName === 'object_2.006' || geoName === 'object_2.008' || geoName === 'object_2.011' || 
                    geoName === 'object_2.014';

                if (isGlassFilm) {
                    let filmPart = 'front';
                    if (glassKey.includes('glass_front1_film') || geoName === 'object_2.009') filmPart = 'row1';
                    else if (glassKey.includes('glass_front2_film') || geoName === 'object_2.010') filmPart = 'row2';
                    else if (glassKey.includes('glass_quarter_film') || geoName === 'object_2.006') filmPart = 'row2';
                    else if (glassKey.includes('glass_rear_film') || geoName === 'object_2.008') filmPart = 'rear';
                    else if (glassKey.includes('glass_front3_film') || geoName === 'object_2.014') filmPart = 'row2';

                    child.updateMatrixWorld(true);

                    const baseFilmMat = child.material.clone();
                    
                    const filmMatBack = baseFilmMat.clone();
                    filmMatBack.side = THREE.BackSide;
                    filmMatBack.userData = { isTintFilmLayer: true, glassPart: filmPart, isInsideFace: true };
                    const filmMeshBack = child.clone();
                    filmMeshBack.material = filmMatBack;
                    filmMeshBack.renderOrder = 20; 

                    const filmMatFront = baseFilmMat.clone();
                    filmMatFront.side = THREE.FrontSide;
                    filmMatFront.userData = { isTintFilmLayer: true, glassPart: filmPart, isInsideFace: false };
                    child.material = filmMatFront;
                    child.renderOrder = 21; 

                    child.parent.add(filmMeshBack);
                    glassMeshes.push(filmMeshBack, child);

                    if (filmPart === 'front') glassMaterials.front.push(filmMatBack, filmMatFront);
                    else if (filmPart === 'row1') glassMaterials.row1.push(filmMatBack, filmMatFront);
                    else if (filmPart === 'row2') glassMaterials.row2.push(filmMatBack, filmMatFront);
                    else if (filmPart === 'rear') glassMaterials.rear.push(filmMatBack, filmMatFront);
                    return;
                }

                // 4. 바깥유리 분리 (앞면/뒷면)
                const isOuterGlass =
                    glassKey.includes('_outer') || glassKey.includes('glass_front_outer') ||
                    glassKey.includes('glass_front1_outer') || glassKey.includes('glass_front2_outer') ||
                    glassKey.includes('glass_quarter_outer') || glassKey.includes('glass_rear_outer') ||
                    glassKey.includes('glass_front3_outer') ||
                    geoName === 'object_2.005' || geoName === 'object_2.002' || geoName === 'object_2.003' ||  
                    geoName === 'object_2.007' || geoName === 'object_2.004' || geoName === 'object_2.012' || 
                    geoName === 'object_2.015';

                if (isOuterGlass) {
                    let outerPart = 'front';
                    if (glassKey.includes('glass_front1_outer') || geoName === 'object_2.002') outerPart = 'row1';
                    else if (glassKey.includes('glass_front2_outer') || geoName === 'object_2.003') outerPart = 'row2';
                    else if (glassKey.includes('glass_quarter_outer') || geoName === 'object_2.007') outerPart = 'quarter';
                    else if (glassKey.includes('glass_rear_outer') || geoName === 'object_2.004') outerPart = 'rear';
                    else if (glassKey.includes('glass_front3_outer') || geoName === 'object_2.015') outerPart = 'quarter';

                    const baseOuterMat = child.material.clone();

                    const outerMatBack = baseOuterMat.clone();
                    outerMatBack.side = THREE.BackSide;
                    outerMatBack.userData = { outerGlassPart: outerPart, isInsideFace: true };
                    const outerMeshBack = child.clone();
                    outerMeshBack.material = outerMatBack;
                    outerMeshBack.renderOrder = 24; 

                    const outerMatFront = baseOuterMat.clone();
                    outerMatFront.side = THREE.FrontSide;
                    outerMatFront.userData = { outerGlassPart: outerPart, isInsideFace: false };
                    child.material = outerMatFront;
                    child.renderOrder = 25; 

                    child.parent.add(outerMeshBack);
                    glassMeshes.push(outerMeshBack, child);
                    outerGlassMeshes.push(outerMeshBack, child); 
                    return;
                }
            }
        });

        scene.add(model);

        const originPoint = new THREE.Vector3(0, 0.6, 0); 
        controls.target.copy(originPoint);
        controls.update();

        extTargetPos.copy(originPoint);
        extCameraPos.set(originPoint.x + 4, originPoint.y + 1.6, originPoint.z + 4);
        camera.position.copy(extCameraPos);

        if (carBodyMaterials.length > 0) {
            carBodyMaterials.forEach(mat => mat.color.setHex(0x3e4247)); 
        }
        
        updateSeatColor(INTERIOR_TRIM_COLOR);
        updateAllGlassMaterials();

        loadingEl.style.display = 'none';
        } catch (err) {
            console.error('모델 처리 중 오류가 발생했습니다.', err);
            showLoadingMessage('모델 처리 오류: ' + (err.message || err));
        }
    }

    const MODEL_FILES = ['glass_film_2.glb', 'glass_film2.glb', 'glass_outer_film.glb', 'glass_film.glb', 'tesla.glb', 'y_whiteseat.glb'];

    if (!THREE.GLTFLoader) {
        showLoadingMessage('GLTFLoader 로드 실패! 인터넷/CDN 연결을 확인해주세요.');
    } else {
        const gltfLoader = new THREE.GLTFLoader();

        function loadModelFile(index) {
            const modelFile = MODEL_FILES[index];
            showLoadingMessage('Loading 3D Model... ' + modelFile);

            gltfLoader.load(modelFile, handleModelLoaded,
                function (xhr) {
                    if (xhr.lengthComputable) {
                        loadingEl.innerText = `Loading 3D Model... ${modelFile} ${Math.round(xhr.loaded / xhr.total * 100)}%`;
                    }
                },
                function (error) {
                    console.warn(modelFile + ' 로드 실패', error);
                    if (index + 1 < MODEL_FILES.length) {
                        loadModelFile(index + 1);
                    } else {
                        showLoadingMessage('GLB 로드 실패! GitHub에 glass_film.glb 또는 tesla.glb 파일이 있는지 확인해주세요.');
                    }
                }
            );
        }
        loadModelFile(0);
    }

    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    const colorBtns = document.querySelectorAll('.color-btn');
    const colorNameDisplay = document.getElementById('selected-color-name');

    colorBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            colorBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            
            const colorName = e.target.getAttribute('data-color');
            const hexColor = e.target.getAttribute('data-hex');
            colorNameDisplay.textContent = colorName;

            if (carBodyMaterials.length > 0) {
                carBodyMaterials.forEach(mat => {
                    mat.color.set(hexColor);
                });
            }
        });
    });

    const interiorBtns = document.querySelectorAll('.interior-btn');
    interiorBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            interiorBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            
            const interiorColor = e.target.getAttribute('data-color');
            if (interiorColor === 'white') {
                updateSeatColor(WHITE_SEAT_COLOR);
            } else {
                updateSeatColor(INTERIOR_TRIM_COLOR);
            }
        });
    });

    const cameraBtns = document.querySelectorAll('.camera-btn');
    let extCameraPos = new THREE.Vector3(4, 2, 5);
    let extTargetPos = new THREE.Vector3(0, 0.6, 0);

    cameraBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            cameraBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');

            const viewMode = e.target.getAttribute('data-view');
            currentViewMode = viewMode;

            if (viewMode === 'exterior') {
                camera.position.copy(extCameraPos);
                controls.target.copy(extTargetPos);

                controls.minDistance = 2;
                controls.maxDistance = 10;
                controls.enableZoom = true;
                controls.enablePan = true;
                controls.rotateSpeed = 1.0;
                controls.maxPolarAngle = Math.PI / 2 - 0.03;

                restoreExteriorGlassView();
            } else {
                extCameraPos.copy(camera.position);
                extTargetPos.copy(controls.target);

                const driverHeadPos = new THREE.Vector3(0.4, 1.4, 0.2); 
                controls.target.copy(driverHeadPos);
                
                camera.position.set(driverHeadPos.x, driverHeadPos.y + 0.0036, driverHeadPos.z - 0.01);
                
                controls.minDistance = 0.01;
                controls.maxDistance = 0.01;
                controls.enableZoom = false;
                controls.enablePan = false;
                controls.rotateSpeed = -0.5; 
                controls.maxPolarAngle = Math.PI;

                setInteriorGlassView();
            }

            controls.update();
        });
    });

    const filmTypeBtns = document.querySelectorAll('.film-type-btn');
    filmTypeBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            filmTypeBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');

            currentFilmType = e.target.getAttribute('data-type');
            if (currentViewMode === 'interior') {
                setInteriorGlassView();
            } else {
                updateAllGlassMaterials();
            }
        });
    });

    const tintGroups = document.querySelectorAll('.tint-options');
    tintGroups.forEach(group => {
        const buttons = group.querySelectorAll('.tint-btn');
        const partName = group.getAttribute('data-part');

        buttons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                buttons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');

                const tintValue = parseInt(e.target.getAttribute('data-value'));
                glassTintValues[partName] = tintValue;

                if (glassMaterials[partName]) {
                    if (currentViewMode === 'interior') {
                        setInteriorGlassView();
                    } else {
                        glassMaterials[partName].forEach(mat => {
                            applyGlassProperties(mat, partName, tintValue, currentFilmType);
                        });
                    }
                }
            });
        });
    });

    const timeBtns = document.querySelectorAll('.time-btn');
    const carDisplay = document.getElementById('car-display');

    timeBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            timeBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');

            const timeMode = e.target.getAttribute('data-time');
            
            if (timeMode === 'day') {
                if (dayExrTexture) {
                    scene.environment = dayExrTexture;
                    scene.background = null;
                    if (hdriBackgroundSphere) hdriBackgroundSphere.visible = true;
                } else {
                    scene.background = new THREE.Color(0xffffff);
                }
                carDisplay.style.backgroundColor = '#ffffff';
                
                ambientLight.intensity = 0.1;
                dirLight.intensity = 1.0;
                topLight.intensity = 0.5;
                interiorLight.intensity = 0.1;
                
                if(dayExrTexture) {
                    renderer.toneMappingExposure = 1.0;
                }
                
                if(neonGroup) neonGroup.visible = false;
            } else {
                if (dayExrTexture) {
                    scene.environment = dayExrTexture;
                    scene.background = null;
                    if (hdriBackgroundSphere) hdriBackgroundSphere.visible = true;
                } else {
                    scene.background = new THREE.Color(0x0a0f1c);
                }
                carDisplay.style.backgroundColor = '#0a0f1c';
                
                ambientLight.intensity = 0.02;
                dirLight.intensity = 0.5;
                topLight.intensity = 0.1;
                interiorLight.intensity = 0.2;

                if(scene.environment) {
                    renderer.toneMappingExposure = 0.1;
                }

                if(neonGroup) neonGroup.visible = true;
            }
        });
    });

    (function setupMobileCarSticky() {
        const carDisplayMobile = document.getElementById('car-display');
        if (!carDisplayMobile) return;

        const mobileQuery = window.matchMedia('(max-width: 760px)');
        const placeholder = document.createElement('div');
        placeholder.className = 'mobile-car-placeholder';
        carDisplayMobile.insertAdjacentElement('afterend', placeholder);

        let stickyStartY = 0;
        let rafPending = false;

        function getStickyStart() {
            const anchor = carDisplayMobile.classList.contains('mobile-car-fixed')
                ? placeholder
                : carDisplayMobile;
            return anchor.getBoundingClientRect().top + window.scrollY;
        }

        function releaseSticky() {
            carDisplayMobile.classList.remove('mobile-car-fixed');
            placeholder.classList.remove('active');
            placeholder.style.height = '0px';
        }

        function measure() {
            if (!mobileQuery.matches) {
                releaseSticky();
                return;
            }

            const wasFixed = carDisplayMobile.classList.contains('mobile-car-fixed');
            if (wasFixed) {
                carDisplayMobile.classList.remove('mobile-car-fixed');
                placeholder.classList.remove('active');
                placeholder.style.height = '0px';
            }

            stickyStartY = carDisplayMobile.getBoundingClientRect().top + window.scrollY;
            updateSticky();
        }

        function updateSticky() {
            if (!mobileQuery.matches) {
                releaseSticky();
                return;
            }

            const shouldFix = window.scrollY >= stickyStartY;

            if (shouldFix) {
                if (!carDisplayMobile.classList.contains('mobile-car-fixed')) {
                    const currentHeight = carDisplayMobile.getBoundingClientRect().height;
                    placeholder.style.height = currentHeight + 'px';
                    placeholder.classList.add('active');
                    carDisplayMobile.classList.add('mobile-car-fixed');
                }
            } else {
                if (carDisplayMobile.classList.contains('mobile-car-fixed')) {
                    releaseSticky();
                }
            }
        }

        function onScroll() {
            if (rafPending) return;
            rafPending = true;
            requestAnimationFrame(() => {
                updateSticky();
                rafPending = false;
            });
        }

        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', () => {
            clearTimeout(window.__mobileCarStickyResizeTimer);
            window.__mobileCarStickyResizeTimer = setTimeout(measure, 120);
        });

        if (mobileQuery.addEventListener) {
            mobileQuery.addEventListener('change', measure);
        } else if (mobileQuery.addListener) {
            mobileQuery.addListener(measure);
        }

        window.addEventListener('load', () => {
            setTimeout(measure, 150);
        });

        setTimeout(measure, 0);
    })();

</script>
