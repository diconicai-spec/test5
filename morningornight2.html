<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Model Y Juniper 3D Configurator with HDRI</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
        }

        .left-panel {
            flex: 1;
            min-width: 500px;
        }

        .header-title {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
        }

        .header-title h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
        }

        .header-title p {
            margin: 5px 0 0 0;
            font-size: 20px;
            color: var(--text-muted);
        }

        .btn-share {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
        }

        .options-row {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .option-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-group label {
            font-size: 14px;
            font-weight: 600;
        }

        select {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 150px;
            outline: none;
        }

        .color-palette {
            display: flex;
            gap: 10px;
        }

        .color-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            outline: 2px solid transparent;
            outline-offset: 2px;
            transition: all 0.2s;
        }

        .color-btn.active {
            outline-color: var(--primary-color);
        }

        .toggle-group {
            display: flex;
            gap: 8px;
        }

        .time-btn, .interior-btn, .camera-btn, .film-type-btn {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: white;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .time-btn.active, .camera-btn.active, .film-type-btn.active {
            background-color: #1e293b;
            color: white;
            border-color: #1e293b;
        }

        .time-btn[data-time="day"].active {
            background-color: #f59e0b;
            border-color: #f59e0b;
        }

        .interior-btn[data-color="black"].active {
            background-color: #1e293b;
            color: white;
            border-color: #1e293b;
        }

        .interior-btn[data-color="white"].active {
            background-color: #f1f5f9;
            color: #0f172a;
            border-color: #94a3b8;
        }

        .car-display {
            position: relative;
            width: 100%;
            height: 500px;
            background-color: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: background-color 0.5s ease;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }

        .right-panel {
            width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            margin-top: 0;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .product-select {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid var(--primary-color);
            border-radius: 12px;
            background-color: #eff6ff;
        }

        .film-type-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px dashed var(--border-color);
        }

        .tint-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .tint-row:last-child {
            margin-bottom: 0;
        }

        .tint-label {
            width: 60px;
            font-weight: 600;
            font-size: 14px;
        }

        .tint-options {
            display: flex;
            gap: 8px;
        }

        .tint-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background-color: #f1f5f9;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tint-btn:hover {
            background-color: #e2e8f0;
        }

        .tint-btn.active {
            background-color: var(--primary-color);
            color: white;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            pointer-events: none;
            z-index: 10;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- EXRLoader 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
</head>
<body>

<div class="container">
    <div class="left-panel">
        <div class="header-title">
            <div>
                <h1>Tesla Model Y Juniper</h1>
                <p id="selected-color-name">스텔스 그레이</p>
            </div>
            <button class="btn-share">공유하기</button>
        </div>

        <div class="options-row">
            <div class="option-group">
                <label>브랜드</label>
                <select>
                    <option>테슬라</option>
                </select>
            </div>
            
            <div class="option-group">
                <label>모델</label>
                <select>
                    <option>모델 Y 주니퍼</option>
                    <option>모델 YL</option>
                    <option>모델 3</option>
                </select>
            </div>

            <div class="option-group">
                <label>실내색상</label>
                <div class="toggle-group">
                    <button class="interior-btn active" data-color="black">블랙</button>
                    <button class="interior-btn" data-color="white">화이트</button>
                </div>
            </div>

            <div class="option-group">
                <label>시점</label>
                <div class="toggle-group">
                    <button class="camera-btn active" data-view="exterior">외부</button>
                    <button class="camera-btn" data-view="interior">내부</button>
                </div>
            </div>

            <div class="option-group">
                <label>차량색상</label>
                <div class="color-palette">
                    <div class="color-btn active" style="background-color: #3e4247;" data-color="스텔스 그레이" data-hex="#3e4247"></div>
                    <div class="color-btn" style="background-color: #ffffff; border: 1px solid #ccc;" data-color="펄 화이트" data-hex="#ffffff"></div>
                    <div class="color-btn" style="background-color: #000000;" data-color="솔리드 블랙" data-hex="#050505"></div>
                    <div class="color-btn" style="background-color: #0d203f;" data-color="딥 블루" data-hex="#0d203f"></div>
                    <div class="color-btn" style="background-color: #931922;" data-color="울트라 레드" data-hex="#8a0b16"></div>
                    <div class="color-btn" style="background-color: #a5a9ac;" data-color="퀵실버" data-hex="#8c9095"></div>
                </div>
            </div>
            
            <div class="option-group" style="margin-left: auto;">
                <label>배경(시간)</label>
                <div class="toggle-group">
                    <button class="time-btn active" data-time="day">☀️ 낮</button>
                    <button class="time-btn" data-time="night">🌙 밤</button>
                </div>
            </div>
        </div>

        <div class="car-display" id="car-display">
            <div id="loading">Loading EXR & Model...</div>
            <div id="canvas-container"></div>
        </div>
    </div>

    <div class="right-panel">
        <div class="card">
            <h2>썬팅(틴팅) 선택</h2>
            
            <div class="product-select">
                <input type="checkbox" checked style="width: 20px; height: 20px; accent-color: var(--primary-color);">
                <div>
                    <div style="font-weight: 700;">디코닉 럭스</div>
                    <div style="font-weight: 700; font-size: 18px;">950,000원</div>
                </div>
            </div>

            <div class="film-type-row">
                <span style="font-weight: 700; font-size: 14px;">필름 타입</span>
                <div class="toggle-group">
                    <button class="film-type-btn" data-type="non-reflective">비반사 (차콜)</button>
                    <button class="film-type-btn active" data-type="reflective">반사 (메탈릭)</button>
                </div>
            </div>

            <div class="tint-row">
                <div class="tint-label">전면</div>
                <div class="tint-options" data-part="front">
                    <button class="tint-btn" data-value="70">70%</button>
                    <button class="tint-btn" data-value="50">50%</button>
                    <button class="tint-btn" data-value="30">30%</button>
                    <button class="tint-btn active" data-value="22">22%</button>
                    <button class="tint-btn" data-value="15">15%</button>
                    <button class="tint-btn" data-value="5">5%</button>
                </div>
            </div>

            <div class="tint-row">
                <div class="tint-label">1열</div>
                <div class="tint-options" data-part="row1">
                    <button class="tint-btn" data-value="70">70%</button>
                    <button class="tint-btn" data-value="50">50%</button>
                    <button class="tint-btn" data-value="30">30%</button>
                    <button class="tint-btn" data-value="22">22%</button>
                    <button class="tint-btn active" data-value="15">15%</button>
                    <button class="tint-btn" data-value="5">5%</button>
                </div>
            </div>

            <div class="tint-row">
                <div class="tint-label">2열</div>
                <div class="tint-options" data-part="row2">
                    <button class="tint-btn" data-value="70">70%</button>
                    <button class="tint-btn" data-value="50">50%</button>
                    <button class="tint-btn" data-value="30">30%</button>
                    <button class="tint-btn" data-value="22">22%</button>
                    <button class="tint-btn active" data-value="15">15%</button>
                    <button class="tint-btn" data-value="5">5%</button>
                </div>
            </div>

            <div class="tint-row">
                <div class="tint-label">후면</div>
                <div class="tint-options" data-part="rear">
                    <button class="tint-btn" data-value="70">70%</button>
                    <button class="tint-btn" data-value="50">50%</button>
                    <button class="tint-btn" data-value="30">30%</button>
                    <button class="tint-btn" data-value="22">22%</button>
                    <button class="tint-btn active" data-value="15">15%</button>
                    <button class="tint-btn" data-value="5">5%</button>
                </div>
            </div>

            <div class="tint-row">
                <div class="tint-label">썬루프</div>
                <div class="tint-options" data-part="sunroof">
                    <button class="tint-btn" data-value="70">70%</button>
                    <button class="tint-btn" data-value="50">50%</button>
                    <button class="tint-btn" data-value="30">30%</button>
                    <button class="tint-btn" data-value="22">22%</button>
                    <button class="tint-btn" data-value="15">15%</button>
                    <button class="tint-btn active" data-value="5">5%</button> 
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- Three.js Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(4, 2, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0; 
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 2;
    controls.maxDistance = 10;

    controls.target.set(0, 0.6, 0);                       
    controls.maxPolarAngle = Math.PI / 2 - 0.03;           

    // 낮 모드용 EXR 텍스처 변수
    let dayExrTexture = null;

    // EXR 로더를 이용한 quattro_canti_4k.exr 파일 로드
    const exrLoader = new THREE.EXRLoader();
    exrLoader.load('https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/4k/quattro_canti_4k.exr', function (texture) {
        texture.mapping = THREE.EquirectangularReflectionMapping;
        dayExrTexture = texture;
        
        // 낮 모드 기본 배경 및 반사 광원 지정
        scene.environment = dayExrTexture;
        scene.background = dayExrTexture;
        
        document.getElementById('loading').style.display = 'none';
        
        updateAllGlassMaterials();
        if (carBodyMaterial) carBodyMaterial.needsUpdate = true;
    });

    // 조명 세팅
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.1); 
    scene.add(ambientLight);
    
    const dirLight = new THREE.DirectionalLight(0xfffaeb, 1.0);
    dirLight.position.set(8, 6, 5); 
    scene.add(dirLight);

    const topLight = new THREE.DirectionalLight(0xffffff, 0.5);
    topLight.position.set(0, 10, 0);
    scene.add(topLight);

    const interiorLight = new THREE.PointLight(0xffecc4, 0, 3);
    interiorLight.position.set(0, 1.0, 0);
    scene.add(interiorLight);

    let carBodyMaterial = null;
    let interiorMaterial = null; 
    let glassMaterials = {
        front: [],
        row1: [],
        row2: [],
        rear: [],
        sunroof: []
    };

    let glassTintValues = {
        front: 22,
        row1: 15,
        row2: 15,
        rear: 15,
        sunroof: 5
    };

    let currentFilmType = 'reflective';
    let neonGroup;

    function setupNeonLights() {
        neonGroup = new THREE.Group();
        const pillarGeo = new THREE.CylinderGeometry(0.08, 0.08, 2.5, 32);
        const pillarMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

        const xOffsets = [-2.5, 2.5];
        const zPositions = [-3.0, -1.0, 1.0, 3.0];

        xOffsets.forEach(x => {
            zPositions.forEach(z => {

                const light = new THREE.PointLight(0xffffff, 0.5, 4);
                light.position.set(x, 1.25, z);
                neonGroup.add(light);
            });
        });

        const ambientFill = new THREE.PointLight(0xffffff, 0.3, 10);
        ambientFill.position.set(0, 4, 0);
        neonGroup.add(ambientFill);

        scene.add(neonGroup);
        neonGroup.visible = false;
    }

    function applyGlassProperties(mat, partName, tintValue, filmType) {
        if (!mat) return;

        if (filmType === 'reflective') {
            mat.metalness = 0.6;
            mat.roughness = 0.3;
            mat.envMapIntensity = 1.0;
            mat.clearcoat = 1.0;
            mat.clearcoatRoughness = 0.0;

            if (partName === 'sunroof') {
                const combinedTint = 5 * (tintValue / 100);
                mat.opacity = 0.95;
                mat.color.setHex(0x2a3237);
            } else {
                mat.opacity = 0.85 + ((100 - tintValue) / 100) * 0.15;
                mat.color.setHex(0x6b7c8a);
            }
        } else {
            mat.metalness = 0.07;
            mat.roughness = 0.05;
            mat.envMapIntensity = 0.5;
            mat.clearcoat = 0.5;
            mat.color.setHex(0x050505);

            if (partName === 'sunroof') {
                const combinedTint = 5 * (tintValue / 100);
                mat.opacity = 1.0 - (combinedTint / 140);
            } else {
                mat.opacity = 1.0 - (tintValue / 140);
            }
        }
        mat.needsUpdate = true;
    }

    function updateAllGlassMaterials() {
        Object.keys(glassMaterials).forEach(part => {
            const tintVal = glassTintValues[part];
            glassMaterials[part].forEach(mat => {
                applyGlassProperties(mat, part, tintVal, currentFilmType);
            });
        });
    }

    function createFallbackCar() {
        const carGroup = new THREE.Group();
        
        const bodyGeo = new THREE.BoxGeometry(2, 0.8, 4.5);
        carBodyMaterial = new THREE.MeshPhysicalMaterial({
            color: 0x3e4247,
            metalness: 0.4,
            roughness: 0.4,
            clearcoat: 0.8,
            clearcoatRoughness: 0.05,
            envMapIntensity: 0.6,
            side: THREE.DoubleSide
        });
        const body = new THREE.Mesh(bodyGeo, carBodyMaterial);
        body.position.y = 0.6; 
        carGroup.add(body);

        const interiorGeo = new THREE.BoxGeometry(1.5, 0.4, 2.3);
        interiorMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x111111, 
            roughness: 0.8, 
            side: THREE.DoubleSide 
        });
        const interiorMesh = new THREE.Mesh(interiorGeo, interiorMaterial);
        interiorMesh.position.set(0, 1.1, 0); 
        carGroup.add(interiorMesh);

        // 운전석 핸들
        const wheelTorusGeo = new THREE.TorusGeometry(0.16, 0.025, 16, 32);
        const wheelTorusMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
        const steeringWheel = new THREE.Mesh(wheelTorusGeo, wheelTorusMat);
        
        steeringWheel.position.set(0.4, 0.95, 0.75);
        steeringWheel.rotation.x = -Math.PI / 6;
        carGroup.add(steeringWheel);

        const columnGeo = new THREE.CylinderGeometry(0.04, 0.06, 0.3);
        const columnMesh = new THREE.Mesh(columnGeo, wheelTorusMat);
        columnMesh.position.set(0.4, 0.85, 0.85);
        columnMesh.rotation.x = Math.PI / 2 - Math.PI / 6;
        carGroup.add(columnMesh);
        
        const createGlassMaterial = (part, tintVal) => {
            const mat = new THREE.MeshPhysicalMaterial({
                transparent: true,
                depthWrite: false,
                side: THREE.DoubleSide
            });
            applyGlassProperties(mat, part, tintVal, currentFilmType);
            return mat;
        };
        
        const frontWinGeo = new THREE.PlaneGeometry(1.5, 0.8);
        const frontWinMat = createGlassMaterial('front', glassTintValues.front);
        glassMaterials.front.push(frontWinMat);
        const frontWin = new THREE.Mesh(frontWinGeo, frontWinMat);
        frontWin.position.set(0, 1.2, 1.25);
        frontWin.rotation.x = -Math.PI / 4;
        carGroup.add(frontWin);

        const side1Geo = new THREE.PlaneGeometry(1.0, 0.5);
        const side1MatL = createGlassMaterial('row1', glassTintValues.row1);
        const side1MatR = createGlassMaterial('row1', glassTintValues.row1);
        glassMaterials.row1.push(side1MatL, side1MatR);
        
        const side1L = new THREE.Mesh(side1Geo, side1MatL);
        side1L.position.set(1.01, 1.1, 0.5);
        side1L.rotation.y = Math.PI / 2;
        carGroup.add(side1L);
        
        const side1R = new THREE.Mesh(side1Geo, side1MatR);
        side1R.position.set(-1.01, 1.1, 0.5);
        side1R.rotation.y = -Math.PI / 2;
        carGroup.add(side1R);

        const side2Geo = new THREE.PlaneGeometry(1.0, 0.5);
        const side2MatL = createGlassMaterial('row2', glassTintValues.row2);
        const side2MatR = createGlassMaterial('row2', glassTintValues.row2);
        glassMaterials.row2.push(side2MatL, side2MatR);
        
        const side2L = new THREE.Mesh(side2Geo, side2MatL);
        side2L.position.set(1.01, 1.1, -0.6);
        side2L.rotation.y = Math.PI / 2;
        carGroup.add(side2L);
        
        const side2R = new THREE.Mesh(side2Geo, side2MatR);
        side2R.position.set(-1.01, 1.1, -0.6);
        side2R.rotation.y = -Math.PI / 2;
        carGroup.add(side2R);

        const rearWinGeo = new THREE.PlaneGeometry(1.4, 0.7);
        const rearWinMat = createGlassMaterial('rear', glassTintValues.rear);
        glassMaterials.rear.push(rearWinMat);
        const rearWin = new THREE.Mesh(rearWinGeo, rearWinMat);
        rearWin.position.set(0, 1.2, -1.25);
        rearWin.rotation.x = Math.PI / 4;
        carGroup.add(rearWin);
        
        const sunroofGeo = new THREE.PlaneGeometry(1.3, 1.8);
        const sunroofMat = createGlassMaterial('sunroof', glassTintValues.sunroof);
        glassMaterials.sunroof.push(sunroofMat);
        const sunroof = new THREE.Mesh(sunroofGeo, sunroofMat);
        sunroof.position.set(0, 1.48, 0);
        sunroof.rotation.x = -Math.PI / 2;
        carGroup.add(sunroof);
        
        const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 32);
        const wheelMat = new THREE.MeshStandardMaterial({color: 0x111111});
        const positions = [
            [1.1, 0.4, 1.5], [-1.1, 0.4, 1.5], [1.1, 0.4, -1.5], [-1.1, 0.4, -1.5]
        ];
        positions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeo, wheelMat);
            wheel.position.set(...pos);
            wheel.rotation.z = Math.PI / 2;
            carGroup.add(wheel);
        });

        scene.add(carGroup);
        setupNeonLights();
    }

    createFallbackCar();

    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    // 1. 차량 색상 변경
    const colorBtns = document.querySelectorAll('.color-btn');
    const colorNameDisplay = document.getElementById('selected-color-name');

    colorBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            colorBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            
            const colorName = e.target.getAttribute('data-color');
            const hexColor = e.target.getAttribute('data-hex');
            colorNameDisplay.textContent = colorName;

            if (carBodyMaterial) {
                carBodyMaterial.color.set(hexColor);
            }
        });
    });

    // 2. 실내 색상 변경
    const interiorBtns = document.querySelectorAll('.interior-btn');
    interiorBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            interiorBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            
            const interiorColor = e.target.getAttribute('data-color');

            if (interiorMaterial) {
                if (interiorColor === 'white') {
                    interiorMaterial.color.setHex(0xdddddd);
                } else {
                    interiorMaterial.color.setHex(0x111111);
                }
            }
        });
    });

    // 3. 카메라(시점) 변경
    const cameraBtns = document.querySelectorAll('.camera-btn');
    let extCameraPos = new THREE.Vector3(4, 2, 5);
    let extTargetPos = new THREE.Vector3(0, 0.6, 0); 

    cameraBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            cameraBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');

            const viewMode = e.target.getAttribute('data-view');

            if (viewMode === 'exterior') {
                camera.position.copy(extCameraPos);
                controls.target.copy(extTargetPos);
                
                controls.minDistance = 2;
                controls.maxDistance = 10;
                controls.enableZoom = true;
                controls.enablePan = true;
                controls.rotateSpeed = 1.0; 
                controls.maxPolarAngle = Math.PI / 2 - 0.03; 
            } else {
                extCameraPos.copy(camera.position);
                extTargetPos.copy(controls.target);
                
                const driverHeadPos = new THREE.Vector3(0.4, 1.15, 0.2); 
                controls.target.copy(driverHeadPos);
                
                camera.position.set(driverHeadPos.x, driverHeadPos.y + 0.0036, driverHeadPos.z - 0.01);
                
                controls.minDistance = 0.01;
                controls.maxDistance = 0.01;
                controls.enableZoom = false;
                controls.enablePan = false;
                controls.rotateSpeed = -0.5; 
                controls.maxPolarAngle = Math.PI;
            }
            controls.update();
        });
    });

    // 4. 필름 타입 선택 토글
    const filmTypeBtns = document.querySelectorAll('.film-type-btn');
    filmTypeBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            filmTypeBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');

            currentFilmType = e.target.getAttribute('data-type');
            updateAllGlassMaterials();
        });
    });

    // 5. 틴팅 농도 변경
    const tintGroups = document.querySelectorAll('.tint-options');
    tintGroups.forEach(group => {
        const buttons = group.querySelectorAll('.tint-btn');
        const partName = group.getAttribute('data-part');

        buttons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                buttons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');

                const tintValue = parseInt(e.target.getAttribute('data-value'));
                glassTintValues[partName] = tintValue;

                if (glassMaterials[partName]) {
                    glassMaterials[partName].forEach(mat => {
                        applyGlassProperties(mat, partName, tintValue, currentFilmType);
                    });
                }
            });
        });
    });

    // 6. 배경 및 시간 토글 (낮 선택 시 EXR 배경 적용)
    const timeBtns = document.querySelectorAll('.time-btn');
    const carDisplay = document.getElementById('car-display');

    timeBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            timeBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');

            const timeMode = e.target.getAttribute('data-time');
            
            if (timeMode === 'day') {
                // 낮 버튼 클릭 시 EXR 배경 및 반사 적용, 노출도 원상복구
                scene.background = dayExrTexture || new THREE.Color(0xffffff);
                scene.environment = dayExrTexture;
                carDisplay.style.backgroundColor = '#ffffff';
                
                ambientLight.intensity = 0.1;
                dirLight.intensity = 1.0;
                topLight.intensity = 0.5;
                interiorLight.intensity = 0;
                
                if(dayExrTexture) {
                    renderer.toneMappingExposure = 1.0;
                }
                
                if(neonGroup) neonGroup.visible = false;
            } else {
                // 밤 버튼 클릭 시에도 EXR 배경 유지, 노출도를 낮춰 어둡게 표현
                scene.background = dayExrTexture || new THREE.Color(0x0a0f1c); // 단색 대신 EXR 배경 유지
                scene.environment = dayExrTexture;
                carDisplay.style.backgroundColor = '#0a0f1c';
                
                ambientLight.intensity = 0.02;
                dirLight.intensity = 0.1;
                topLight.intensity = 0.1;
                interiorLight.intensity = 0.8;

                if(scene.environment) {
                    renderer.toneMappingExposure = 0.1; // 배경과 차량 모두 어두워짐
                }

                if(neonGroup) neonGroup.visible = true;
            }
        });
    });
</script>

</body>
</html>
